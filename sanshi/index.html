<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人生模拟器 · 她的三十而立（橙光版）</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#2b2340;min-height:100vh;background:linear-gradient(180deg,#fff3d6,#ffe4ec 55%,#e3e6ff);background-attachment:fixed;transition:background .8s linear}
  body.th1{background:linear-gradient(180deg,#ffe9d2,#ffd9e6 50%,#e9e2ff)}
  body.th2{background:linear-gradient(180deg,#fdf0d5,#ffd9ad 50%,#f0dcd2)}
  body.th3{background:linear-gradient(180deg,#ffe0ec,#ffb8cd 55%,#e5c8ff)}
  body.th4{background:linear-gradient(180deg,#3a2b4d,#5a3457 55%,#8a4a44)}
  body.th5{background:linear-gradient(180deg,#ffddab,#ffb273 55%,#ff8f7d)}
  body.thE{background:linear-gradient(180deg,#241a38,#43284e 55%,#7c4536)}
  .wrap{max-width:500px;margin:0 auto;padding:14px 14px 40px;word-break:break-word}
  .hero{background:rgba(43,35,64,.92);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 10px 26px rgba(43,35,64,.28)}
  .hero .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.85}
  .hero h1{font-size:19px;margin:6px 0 2px;letter-spacing:.5px}
  .hero .sub{font-size:12px;opacity:.8}
  .progress{height:8px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden;margin-top:10px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,#ffb020,#ff5d8f);border-radius:99px;transition:width .5s ease}
  .pills{display:flex;gap:6px;margin:12px 0}
  .pill{flex:1;position:relative;background:rgba(255,255,255,.94);border-radius:14px;padding:8px 4px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.08);font-size:11px;color:#5a5372}
  .pill b{display:block;font-size:17px;margin-top:2px;color:#2b2340}
  .fl{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:14px;font-weight:900;pointer-events:none;z-index:9;animation:flup 1.5s ease-out forwards;text-shadow:0 1px 2px rgba(255,255,255,.9)}
  .fl.up{color:#1f9d55}.fl.dn{color:#e5484d}
  @keyframes flup{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
  .card{background:rgba(255,255,255,.95);border-radius:22px;padding:14px;box-shadow:0 12px 26px rgba(0,0,0,.12);animation:pop .35s ease}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .stage{font-size:12px;color:#ff5d8f;font-weight:800;letter-spacing:1px;margin:2px 2px 8px}
  /* ===== 场景 ===== */
  .scene{position:relative;height:392px;border-radius:18px;overflow:hidden;box-shadow:inset 0 -30px 60px rgba(20,10,30,.18),0 8px 20px rgba(0,0,0,.18);cursor:pointer;user-select:none;background:#886}
  .bg{position:absolute;inset:0;transition:background .6s}
  .props{position:absolute;inset:0;pointer-events:none;z-index:2}
  .props span{position:absolute;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));transform:translate(-50%,-50%)}
  .stan{position:absolute;bottom:0;width:46%;max-width:250px;transition:opacity .45s ease,filter .45s ease,transform .45s ease;z-index:3}
  .stan.l{left:2%}.stan.r{right:2%}
  .stan svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
  .stan.dim{filter:brightness(.6);transform:scale(.96)}
  .stan.act{z-index:4;filter:none;transform:scale(1)}
  .stan.act svg{filter:drop-shadow(0 0 16px rgba(255,220,130,.55)) drop-shadow(0 10px 12px rgba(0,0,0,.3))}
  .stan .pimg,.stan svg{animation:stanIn .45s ease}
  @keyframes stanIn{from{opacity:0}to{opacity:1}}
  /* 图片立绘：完整半身像，contain 不裁不切，底部贴场景底 */
  .stan.imgmode{height:78%;top:auto;bottom:0;display:flex;align-items:flex-end;justify-content:center}
  .stan .pimg{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;object-position:50% 100%;display:block;border-radius:14px;border:3px solid #fff8ec;box-shadow:0 8px 18px rgba(0,0,0,.35)}
  .stan.dim .pimg{filter:brightness(.6)}
  .stan.act .pimg{filter:none}
  /* 立绘表情反馈（第 12 项）：开心上浮 / 难过下沉 / 生气抖动 */
  .stan.act.eh .pimg,.stan.act.eh svg{animation:stanHappy .6s ease}
  .stan.act.es .pimg,.stan.act.es svg{animation:stanSad .6s ease}
  .stan.act.ea .pimg,.stan.act.ea svg{animation:stanAngry .35s ease}
  @keyframes stanHappy{0%{transform:translateY(0)}35%{transform:translateY(-6px);filter:brightness(1.1)}100%{transform:translateY(0)}}
  @keyframes stanSad{0%{transform:translateY(0)}35%{transform:translateY(6px);filter:brightness(.8)}100%{transform:translateY(0)}}
  @keyframes stanAngry{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  /* 声音按钮与提示 */
  .sndbtn{position:fixed;top:10px;right:10px;z-index:60;width:40px;height:40px;border-radius:50%;border:2px solid #ffd982;background:rgba(26,16,36,.9);color:#ffd982;font-size:17px;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .sndhint{position:fixed;top:56px;right:10px;z-index:60;background:rgba(26,16,36,.92);color:#ffe9c9;border:1px solid #d9b36a;border-radius:12px;font-size:11px;padding:6px 9px;max-width:132px;text-align:center;line-height:1.55;box-shadow:0 4px 10px rgba(0,0,0,.35)}
  /* ===== V4：面板系统 ===== */
  #panel{position:fixed;inset:0;z-index:55;background:rgba(15,8,24,.72);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
  #panelBody{background:#fff;color:#2b2340;border-radius:20px;max-width:500px;width:100%;padding:16px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
  .ptitle{font-size:16px;font-weight:900;margin:4px 0 10px;color:#5a3a6e}
  .scard{display:flex;gap:10px;align-items:center;border:1.5px solid #eadfe0;border-radius:14px;padding:10px;margin:8px 0;background:#fffafc}
  .scl{font-size:12px;font-weight:900;color:#8a6a9a;width:52px;flex:none}
  .sci{flex:1;font-size:12px;line-height:1.65;color:#4c4368}
  .scb{display:flex;flex-direction:column;gap:5px}
  .sbtn{border:1.5px solid #d9b36a;background:#fff;color:#7a5c1e;border-radius:10px;padding:5px 10px;font-size:12px;font-weight:800;cursor:pointer}
  .sbtn.warn{border-color:#e5484d;color:#e5484d}
  .chbtn{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:2px solid #f0e0ff;background:#fff;border-radius:14px;padding:11px;font-size:14px;font-weight:800;margin:7px 0;cursor:pointer;color:#2b2340}
  .chbtn span{font-size:11px;color:#9a90b3;font-weight:400;margin-left:auto}
  .chbtn.lock,.chbtn:disabled{opacity:.5;cursor:not-allowed}
  .setrow{display:flex;gap:8px;align-items:center;margin:10px 0}
  .setrow span{width:64px;font-size:13px;font-weight:800;color:#5a5372}
  .setb{flex:1;border:2px solid #eee;background:#fff;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:800;cursor:pointer;color:#2b2340}
  .setb.on{border-color:#ff5d8f;background:#fff0f5;color:#e5487a}
  .stgrid{display:flex;gap:6px;margin:6px 0 10px}
  .stcell{flex:1;background:#fff6f0;border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;color:#5a5372}
  .stcell b{display:block;font-size:17px;color:#2b2340}
  .statrow{display:flex;justify-content:space-between;font-size:13px;padding:7px 4px;border-bottom:1px dashed #eee}
  .statrow b.up{color:#1f9d55}.statrow b.dn{color:#e5484d}
  .ggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
  .gcell{border:1.5px solid #eadfe0;border-radius:14px;padding:8px;text-align:center;background:#fff;cursor:pointer}
  .gcell.lock,.gcell:disabled{opacity:.55;cursor:default}
  .gthumb{display:flex;align-items:center;justify-content:center;height:64px;border-radius:10px;overflow:hidden;position:relative}
  .gthumb .gemoji{font-size:26px}
  .glocked{background:#e8e2ea;color:#9a90b3}
  .gname{display:block;font-size:11px;font-weight:800;margin-top:5px;color:#5a4b8a}
  .cgview{border-radius:14px;overflow:hidden;position:relative;height:300px;margin:6px 0}
  .grow{display:flex;gap:8px;justify-content:center}
  .lscroll{max-height:52vh;overflow-y:auto;background:#fff6f0;border-radius:12px;padding:10px;margin-bottom:10px}
  .lrow{margin:8px 0}.lrow b{font-size:12px;color:#b06a9a}.lrow p{margin:3px 0 0;font-size:13px;line-height:1.7;color:#3a3350}
  .ghost.dis,.ghost:disabled{opacity:.45;cursor:not-allowed}
  /* ===== V4：对话框角按钮 / 转场 / CG 闪白 ===== */
  .dbtns{position:absolute;top:-15px;right:8px;display:flex;gap:4px;z-index:9}
  .dbtn{border:1.5px solid #d9b36a;background:rgba(26,16,36,.92);color:#ffd982;border-radius:99px;font-size:10.5px;font-weight:800;padding:3px 8px;cursor:pointer}
  .dbtn.on{background:#ffd982;color:#2b2340}
  .scene.fadin{animation:sceneIn .5s ease}
  @keyframes sceneIn{from{opacity:0}to{opacity:1}}
  .card.chap{animation:chapIn .5s ease}
  @keyframes chapIn{from{opacity:0}to{opacity:1}}
  .cgflash{position:absolute;inset:0;background:#fff;z-index:20;pointer-events:none;animation:cgf .35s ease-out forwards}
  @keyframes cgf{from{opacity:.9}to{opacity:0}}
  /* ===== 场景背景库 ===== */
  .bgClass{background:linear-gradient(180deg,#fdf3dd,#ffdfb5)}
  .bgClass::before{content:"";position:absolute;left:7%;right:7%;top:7%;height:32%;background:linear-gradient(180deg,#2f5a44,#24493a);border-radius:10px;box-shadow:inset 0 0 0 6px #b98a4f,0 4px 10px rgba(0,0,0,.15)}
  .bgClass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:repeating-linear-gradient(90deg,#c9a06a 0 60px,#bd9058 60px 120px)}
  .bgDorm{background:linear-gradient(180deg,#4a3a5e,#7a5570)}
  .bgDorm::before{content:"";position:absolute;left:9%;top:9%;width:36%;height:30%;background:radial-gradient(circle at 70% 30%,#ffe9a8,#ffb35c 75%);border:6px solid #5a4a6e;border-radius:8px}
  .bgDorm::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#3a2c48,#2c2138);border-top:4px solid #8a6a9a}
  .bgClub{background:linear-gradient(180deg,#fff2e0,#ffd9c2)}
  .bgClub::before{content:"";position:absolute;left:8%;right:8%;top:8%;height:30%;background:repeating-linear-gradient(180deg,#c98a4f 0 8px,#8a5a33 8px 13px);border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
  .bgClub::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14%;background:linear-gradient(180deg,#d9b088,#c09a6a)}
  .bgMarket{background:linear-gradient(180deg,#ff9a6b,#c96b8a 58%,#5a3a6e)}
  .bgMarket::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff3b0 3px,transparent 4.5px),radial-gradient(circle,#ffd982 2.5px,transparent 4px);background-size:70px 46px,54px 38px;background-position:12px 18px,40px 44px;opacity:.9}
  .bgMarket::after{content:"";position:absolute;left:0;right:0;bottom:0;height:19%;background:repeating-linear-gradient(90deg,#e05580 0 26px,#fff2f6 26px 52px);border-top:4px solid #b83a63}
  .bgOffice{background:linear-gradient(180deg,#dfe8f5,#b9c9e2)}
  .bgOffice::before{content:"";position:absolute;left:5%;right:5%;top:6%;height:58%;background:repeating-linear-gradient(90deg,rgba(90,120,170,.4) 0 3px,rgba(255,255,255,.35) 3px 70px),linear-gradient(180deg,#cfdcf0,#aebfdd);border-radius:8px}
  .bgOffice::after{content:"";position:absolute;left:0;right:0;bottom:0;height:15%;background:linear-gradient(180deg,#8fa3c4,#7a8fb0)}
  .bgContest{background:linear-gradient(180deg,#2a1638,#5a2440)}
  .bgContest::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% -12%,rgba(255,240,190,.95),rgba(255,200,120,.25) 46%,transparent 72%)}
  .bgContest::after{content:"";position:absolute;left:0;right:0;bottom:0;height:17%;background:linear-gradient(180deg,#8a5a33,#5f3c1f);box-shadow:0 -6px 18px rgba(255,200,120,.25)}
  .bgStreet{background:linear-gradient(180deg,#2b2350,#5a3a6e 55%,#8a4a5e)}
  .bgStreet::before{content:"";position:absolute;left:0;right:0;top:30%;height:38%;background:linear-gradient(180deg,transparent,rgba(18,12,34,.92) 78%),repeating-linear-gradient(90deg,#241a3e 0 44px,#2e2250 44px 90px)}
  .bgStreet::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(180deg,#3a3050,#2a2440);box-shadow:0 -40px 60px 10px rgba(255,220,140,.14)}
  .bgHome{background:linear-gradient(180deg,#e8c9a0,#c9a06a)}
  .bgHome::before{content:"";position:absolute;left:14%;right:14%;top:8%;height:44%;background:linear-gradient(180deg,#8a5a3a,#6e4630);border:8px solid #5a3a26;border-radius:8px 8px 0 0;box-shadow:inset 0 0 30px rgba(0,0,0,.25)}
  .bgHome::after{content:"";position:absolute;left:0;right:0;bottom:0;height:13%;background:repeating-linear-gradient(90deg,#b3854f 0 70px,#a3743f 70px 140px)}
  .bgCafe{background:linear-gradient(180deg,#5a3a2e,#7a4a38)}
  .bgCafe::before{content:"";position:absolute;right:8%;top:10%;width:38%;height:36%;background:radial-gradient(circle at 40% 40%,#ffe9b8,#e8a860 80%);border:6px solid #4a3026;border-radius:8px}
  .bgCafe::after{content:"";position:absolute;left:0;right:0;bottom:0;height:15%;background:linear-gradient(180deg,#6e4630,#54341f)}
  .bgShop{background:linear-gradient(180deg,#ffe9c9,#e8b888)}
  .bgShop::before{content:"";position:absolute;left:6%;right:6%;top:9%;height:26%;background:repeating-linear-gradient(90deg,#a06b4a 0 4px,transparent 4px 46px),linear-gradient(180deg,#c98a5f,#b0764e);border-radius:6px}
  .bgShop::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14%;background:linear-gradient(180deg,#8a5a3f,#6e4630)}
  .bgVenue{background:linear-gradient(180deg,#3a2440,#8a4a5e)}
  .bgVenue::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#ffe9a8 2.5px,transparent 4px),radial-gradient(circle,#ffd982 2px,transparent 3.5px);background-size:64px 44px,48px 36px;background-position:10px 14px,36px 34px;opacity:.85}
  .bgVenue::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(180deg,#a03050,#701f3a);border-top:5px solid #e0b060}
  .bgRooftop{background:linear-gradient(180deg,#1c1436,#4a2a5e)}
  .bgRooftop::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1.4px,transparent 2.4px),radial-gradient(circle,#ffe9c9 1.2px,transparent 2px);background-size:90px 70px,64px 52px;background-position:20px 30px,58px 16px}
  .bgRooftop::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,transparent,rgba(16,10,30,.95) 60%),repeating-linear-gradient(90deg,#201840 0 40px,#2a2050 40px 84px)}
  .bgStudio{background:linear-gradient(180deg,#fff0dc,#ffd9b8)}
  .bgStudio::before{content:"";position:absolute;left:7%;right:7%;top:8%;height:28%;background:repeating-linear-gradient(90deg,#c98a5f 0 5px,transparent 5px 44px),linear-gradient(180deg,#e0a878,#d09460);border-radius:6px}
  .bgStudio::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14%;background:repeating-linear-gradient(90deg,#d9a86f 0 64px,#c89055 64px 128px)}
  .bgHospital{background:linear-gradient(180deg,#e8f2f5,#c9dde8)}
  .bgHospital::before{content:"";position:absolute;left:10%;top:9%;width:34%;height:30%;background:linear-gradient(180deg,#d5f0ff,#a8d8f0);border:6px solid #8fb5c9;border-radius:8px}
  .bgHospital::after{content:"";position:absolute;left:0;right:0;bottom:0;height:13%;background:linear-gradient(180deg,#b5ccd8,#9db8c8)}
  /* ===== 对话框（橙光式大框） ===== */
  .dlg{position:absolute;left:4%;right:4%;bottom:10px;z-index:8;border-radius:20px;background:linear-gradient(180deg,rgba(26,16,36,.85),rgba(16,9,26,.96));border:1.5px solid #d9b36a;box-shadow:0 12px 28px rgba(0,0,0,.5),inset 0 0 26px rgba(217,179,106,.07);padding:18px 14px 22px;color:#fff;min-height:124px}
  .dlg .tag{position:absolute;top:-16px;left:12px;display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#2b1f3a,#1c1228);border:1.5px solid #d9b36a;border-radius:99px;padding:3px 15px 3px 4px;box-shadow:0 5px 12px rgba(0,0,0,.45)}
  .dlg .av{width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid #ffd982;background:#2b2340;flex:none}
  .dlg .av svg{width:100%;height:100%;display:block}
  .dlg .av .avimg{width:100%;height:100%;display:block;background-size:cover;background-position:50% 16%}
  .dlg .nm{font-weight:900;font-size:14px;color:#ffd982;text-shadow:0 1px 4px rgba(0,0,0,.7);letter-spacing:1px}
  .dlg .tx{font-size:var(--dlgfont,16px);line-height:1.85;margin-top:10px;min-height:58px;letter-spacing:.3px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .dlg.narr .tx{color:#ffe9c9;font-style:italic}
  .dlg.inner .tx{color:#d9c9ff;font-style:italic}
  .dlg .nx{position:absolute;right:14px;bottom:8px;color:#ffd982;animation:blink 1s infinite;font-size:13px}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
  /* ===== 选项浮层 ===== */
  .choices{position:absolute;inset:0;z-index:9;background:rgba(26,16,38,.78);backdrop-filter:blur(2px);display:flex;flex-direction:column;justify-content:flex-end;padding:12px 12px 14px;animation:pop .3s ease;overflow-y:auto}
  .choices .q{color:#fff;font-size:16.5px;font-weight:800;line-height:1.5;margin:4px 2px 10px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
  .opt{display:block;width:100%;text-align:left;border:0;font-family:inherit;background:#fff;border-radius:16px;padding:11px 11px 11px 13px;margin:5px 0;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2);border-left:6px solid #ccc;transition:transform .12s ease}
  .opt:active{transform:scale(.98)}
  .opt.pink{background:linear-gradient(90deg,#fff2f6,#fff);border-left-color:#ff5d8f}
  .opt.blue{background:linear-gradient(90deg,#eef4ff,#fff);border-left-color:#5b8def}
  .opt.gold{background:linear-gradient(90deg,#fff7e3,#fff);border-left-color:#ffb020}
  .opt .ot{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.5;color:#2b2340}
  .opt .num{width:25px;height:25px;flex:none;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
  .opt.pink .num{background:#ff5d8f}.opt.blue .num{background:#5b8def}.opt.gold .num{background:#ffb020}
  .opt .hint{display:block;margin:6px 0 0 34px;font-size:11.5px;letter-spacing:.5px}
  .hint .up{color:#1f9d55;font-weight:800}.hint .dn{color:#e5484d;font-weight:800}
  .opt[disabled]{cursor:default;opacity:.5}
  .opt.sel{opacity:1;outline:3px solid #ff5d8f;outline-offset:1px}
  /* ===== CG ===== */
  .cg{position:absolute;inset:0;z-index:12;background:#120b1c;overflow:hidden;cursor:pointer}
  .cg .cbg{position:absolute;inset:0;opacity:.92}
  .cgfx{position:absolute;inset:0;pointer-events:none;z-index:6}
  .cgframe{position:absolute;inset:7px;border:3px solid #ffd982;border-radius:14px;pointer-events:none;box-shadow:inset 0 0 40px rgba(255,217,130,.2),0 0 24px rgba(255,217,130,.35);z-index:7}
  .cgtitle{position:absolute;left:0;right:0;bottom:46px;z-index:8;text-align:center;color:#fff}
  .cgtitle .cgk{display:inline-block;font-size:10px;letter-spacing:3px;color:#ffd982;background:rgba(0,0,0,.45);border-radius:99px;padding:3px 12px;font-weight:900}

  {t:"笑着回敬：“你打听这么细，是想帮我申请吗？”",e:{h:2,m:1,f:-2},rel:{gu:-15,fy:5},mom:"我第一次学会笑着还击",fb:["全班哄笑，辅导员憋笑憋出内伤。","顾曼妮在笔记本上写下你的名字，笔画很轻。轻的东西，往往记得最久。"]}]},
 {a:18,ci:0,bg:"bgDorm",tt:"第 2 关 · 被造谣",q:"谣言缠身，你怎么办？",sc:[
  {s:"n",t:"十月，校园墙炸了帖：《实锤！某“贫困生”拿助学金换新手机》，配图是你昨天发的朋友圈。照片裁得刚刚好——刚好只剩你，和一部手机。"},
  {c:"tian",x:"angry",s:"o",t:"那是我送你的生日礼物！二手的！三百块！我这就去撕了他们！"},
  {s:"os",t:"帖子盖到两百多层。“建议取消资格”排在最前面，点赞最多。"},
  {c:"gu",x:"smug",s:"o",t:"哎呀，我不了解具体情况啦。不过贫困生，是不是更该注意点影响呀？"},
  {s:"n",t:"深夜，技术系的学姐发来私信：发帖小号的登录 IP，和顾曼妮跟班的宿舍是同一个。"},
  {s:"os",t:"你忽然想起妈妈的老话——针眼大的洞，斗大的风。她总是拿缝纫打比方。"}],
  o:[
  {t:"要求辅导员出面：查 IP、公开澄清",e:{f:2,h:1,he:-1},rel:{fy:15,tian:10,gu:-10},mom:"我用三个通宵，把谣言钉死在证据上",fb:["辅导员约谈，删帖，书面道歉，全班传阅。","可“贫困生爱虚荣”的版本并没有死透——它只是学会了改名换姓。有些帖子删得掉，有些眼神删不掉。"]},
  {t:"直播开箱全部家当，自证到底",e:{h:2,f:1,m:-1},rel:{tian:15,fy:5},mom:"一场直播，让骂我的人刷了满屏对不起",fb:["你把旧手机、打折画材、洗白的帆布包一样样摆出来，弹幕从辱骂刷成道歉。","道歉很轻，眼泪很重。下播后你对着黑屏坐了很久——原来自证是有价的，这个价你付了一次，记住了。"]},
  {t:"不回应，用期末成绩说话",e:{m:1,he:1,h:-2},rel:{gu:-5},fb:["期末你考了专业第二，谣言自己凉了半截。","只是“虚荣”的标签贴了整整一学期。你没输，但也没赢——你只是学会了：有些仗，要用一整个学期来打。而那一学期里，有人看你的眼神，再也回不到最初。"]}]},
 {a:19,ci:0,bg:"bgClub",tt:"第 3 关 · 社团打脸",q:"省赛机会砸下来，你接不接？",sc:[
  {s:"n",t:"手工设计社招新。社长顾曼妮把三台新缝纫机分给自己人，给你的是一台卡线的老古董，踏板要用脚跟找角度。"},
  {c:"gu",x:"smug",s:"o",t:"旧衣改造嘛～市集摊位给你留了个角落，别嫌弃哦。"},
  {s:"os",t:"角落就角落。你把爸爸的旧工装拆了重缝——妈妈牌的锁边法藏在针脚里，这手艺没处学，它长在你手上。"},
  {s:"n",t:"市集那天，你的摊位排起了队。有人为了摸一摸那道麦穗锁边，甘愿排二十分钟。"},
  {c:"sl",x:"happy",s:"o",t:"这锁边……谁教你的？省新锐赛，敢不敢报？"},
  {cg:"cg2"},
  {c:"man",x:"smug",s:"m",t:"敢。"},
  {s:"os",t:"人群外，顾曼妮攥着手机的手指发白。她第一次知道，角落里的东西，也会长牙。"}],
  o:[
  {t:"报名省赛，用成绩把她的脸打肿",e:{h:2,f:1,he:-2},rel:{gu:-20,sl:20},mom:"角落里的老缝纫机，缝出了全校唯一的省赛入围",fb:["白天上课，晚上备赛，颜料洗进指甲缝。名单公布那天，设计社群安静得像默哀。","你，入围了。全社唯一。代价是三周没在天黑前见过宿舍。"]},
  {t:"谢绝省赛，先保绩点和奖学金",e:{m:1,he:1,h:-1},rel:{sl:10,fy:5,gu:5},fb:["绩点冲到专业第一，奖学金加分稳了。","只是每次路过市集，你都会多看那张入围海报两眼。有些门关上了，会一直留一条缝。"]},
  {t:"退社自己练，把参赛资格带走",e:{h:1,m:1,f:-2},rel:{gu:-10,sl:-5},fb:["你带着方案退了社，书桌就是工作室。","清净是真的，冷也是真的。第一次没人分享入围消息的下午，你把手机屏幕点亮又按灭。"]}]},
 {a:19,ci:0,bg:"bgShop",tt:"第 4 关 · 兼职被坑",q:"第一份工资被坑，你怎么办？",sc:[
  {s:"n",t:"省赛材料费要八百。你在校门口奶茶店打工一个月，发薪日，工资条上写着：实发 380。"},
  {c:"man",x:"angry",s:"m",t:"阿姨，说好一千二。培训费 400、杯子损耗 300、迟到扣 120——这是什么？"},
  {c:"bsn",x:"smug",s:"o",t:"学生工都这行情！有本事去告啊，起诉费都比这钱贵！"},
  {s:"os",t:"你攥着那张薄薄的纸站在太阳底下，第一次明白：课本上的“按劳分配”，和现实之间，隔着一张老板娘的嘴。"},
  {s:"n",t:"甜甜拉住你，晃了晃手机：“排班表和打卡记录，我每天都拍。”"}],
  o:[
  {t:"拉着同学集体去劳动监察投诉",e:{m:3,f:2},rel:{bsn:-20,tian:15},mom:"第一次讨薪：820 块，和七个人的公道",fb:["监察大队上门那天，老板娘当场补齐七个人的差额，还被罚了款。","你拿回 820 块，也给后来的人蹚出一条路。代价是附近三家店从此贴出“不招江大学生”——公道有价，标签也有价。"]},
  {t:"只讨回自己那份，息事宁人",e:{m:1,h:-1},rel:{bsn:-10,tian:-5},fb:["打卡照片摆上桌，820 一分不少。","其他人的钱没了下文。甜甜没说什么，只是那一周的路上，她走在你前面半步。你知道那半步是什么意思——你护住了自己，却没护住一起干活的人。"]},
  {t:"认栽走人，把时间省下来备赛",e:{h:1,m:-1},rel:{bsn:-5,tian:5},mom:"820 块的学费，教会我社会第一课",fb:["你把工资条折进笔记本——封皮是妈妈用做衣服剩下的布头缝的——扉页写了三个字：第一课。","那晚你多画了两张稿。钱没回来，但“下不为例”这四个字，从此长在了你身上。"]}]},
 {a:20,ci:0,bg:"bgOffice",tt:"第 5 关 · 暗恋对象站队",q:"投票箱前的心事，你怎么处理？",sc:[
  {s:"n",t:"奖学金评议会。国奖名额一个，你和顾曼妮综合分并列第一。顾家是学院的捐赠方——这四个字，压得会议室很沉。"},
  {c:"gu",x:"smug",s:"o",t:"陆之遥，你是学生代表嘛。“助学金出身的”和董事千金，名额该给谁呀？"},
  {s:"n",t:"全场看向他。他捏着笔，指节发白。三秒，像三年。"},
  {c:"lu",x:"sad",s:"o",t:"我申请——全程公开唱票，评委回避情况一并公示。程序正义，比“给谁”更有说服力。"},
  {s:"os",t:"他没站她。可他，也没站你。心里那颗埋了半年的种子，被这三秒冻住了一半。"}],
  o:[
  {t:"会后谢谢他推动公开唱票",e:{f:1,h:1,m:-1},rel:{lu:20,gu:-5},fb:["你买了两杯热豆浆过去：“谢谢。”他愣了一下，笑得比平时真。","冻住的那一半化了一点——就一点。有些话你俩都没说，豆浆是热的，话是凉的。你忽然觉得，有些人适合并肩，不适合被指望。"]},
  {t:"当面质问：你为什么不敢直接投我",e:{f:1,h:-1},rel:{lu:10,gu:-10},fb:["楼道里他沉默很久：“我妈住院那年，顾家捐过病房。有些票，我投不起。”","你听懂了，也更难受了——原来少年的沉默里，也压着一整个病房的重量。你忽然想起，妈妈住院那年，家里也是这样一条沉默的走廊。有些理解，比不理解更疼。"]},
  {t:"从此只当普通同学，专心冲刺",e:{m:1,he:1,h:-1},rel:{lu:-5},fb:["你把心事锁进抽屉，成绩又涨了一截。","有些喜欢输给了自尊心。你说不清那是遗憾，还是省下来的力气。后来路过那条走廊，你很少再回头。"]}]},
 {a:20,ci:0,bg:"bgClass",tt:"第 6 关 · 期末逆袭",q:"这句话像根刺，你怎么拔？",sc:[
  {s:"n",t:"期末周。你白天考试，晚上改省赛终稿，凌晨四点的自习室只剩你一盏灯，和那把旧剪刀划过纸样的声音。"},
  {s:"n",t:"成绩出来：综合分反超 0.3，奖学金公示第一名——林小满。省赛铜奖，历届最好成绩。"},
  {c:"fy",x:"happy",s:"o",t:"不容易，真不容易啊小满。"},
  {s:"n",t:"颁奖礼后台，顾曼妮补着口红，忽然凑近，声音轻得像根针落地——"},
  {c:"gu",x:"smug",s:"o",t:"恭喜啊。不过——你以为奖学金，真是凭成绩拿的？"},
  {s:"os",t:"高跟鞋声像倒计时。公示期，还有三天。你想起妈妈册子上没有字的那一页——空白，有时候不是没有，是还没到揭开的时候。"}],
  hk:"<b>下一章预告 ·《职场宫斗》</b><br>公示第三天，名单会变吗？走进写字楼的你，即将明白：社会的刀，比校园的嘴更利。",
  o:[
  {t:"追上去逼她说清楚",e:{f:1,h:-1},rel:{gu:-10},mom:"她说：你以为奖学金真是凭成绩拿的？",fb:["你抓住她手腕，她笑着甩开：“急什么？三天后自己看呀。”","周围相机闪成一片——她要的就是你失态。你松手的动作比她快，这是你那天唯一赢的地方。可松手的时候，你知道：有些话一旦追问，就再也收不回来。"]},
  {t:"直接去教务处申请调评审记录",e:{m:1,f:1,h:-1},rel:{fy:10,gu:-5},fb:["教务处老师翻着系统：“记录没问题呀。”可“综合评定”备注栏里，有一处修改的痕迹，淡得像没发生过。","你把每一页都拍了照。有些证据现在用不上，但它在，你就不慌。只是从那天起，你开始习惯把所有东西都存两份。"]},
  {t:"先截图保存一切，按兵不动",e:{m:1,h:1,f:-1},rel:{gu:-5},fb:["公示页、成绩单、评审细则，全部存档，一个字没说。","那晚你梦见一台从没见过的缝纫机，踏板声很稳，像有人在替你踩着一整夜。你没追问，也没松手——你只是把刀先收回了鞘。"]}]}
]},{no:2,name:"职场宫斗",em:"💼",ages:"21 - 23 岁",sub:"方案是我的，署名是别人的。",cast:["man","lw","wk","lj"],pre:"20 岁那年，奖学金公示第三天，你的名字变成了“顾曼妮”。申诉石沉大海，你把那页截图设成壁纸——不是记恨，是提醒。",
 levels:[
 {a:21,ci:1,bg:"bgOffice",tt:"第 7 关 · 实习被抢功",q:"署名被抢，这一刀怎么捅回去？",sc:[
  {s:"n",t:"大三，锦绣服饰设计部实习。转正名额一个，实习生五个。"},
  {s:"n",t:"你熬了四个通宵的《麦浪》系列，晨会上被王凯一字不差讲了十二分钟。PPT 最后一页，署名：王凯。"},
  {cg:"cg3"},
  {c:"wk",x:"smug",s:"o",t:"昨晚灵感爆发，一气呵成！哈哈，见笑见笑。"},
  {s:"os",t:"心脏像被人攥了一下。屏幕上那株麦穗的每一道褶，都是你凌晨三点画的——褶皱走活线，这是妈妈手稿里的规矩。"},
  {s:"n",t:"问答环节，总监梁薇问“双层锁边怎么落地”。王凯张口就答：“热压工艺。”"},
  {s:"os",t:"错了。原稿写的是手工锁边——因为麦穗纹要走活线。这一点，全世界只有作者知道。"}],
  o:[
  {t:"当场举手：“是手工锁边，热压会毁纹样——原稿第 9 页。”",e:{h:2,m:1,f:-1},rel:{wk:-15,lw:15},mom:"当着全组的面，我把署名抢了回来",fb:["会议室死一般安静。梁薇翻原稿，看了你十秒：“散会后，源文件发我。”","王凯的笑僵在脸上。你赢了这一局，也上了他的名单——名单这个词，在职场里不是好消息。"]},
  {t:"会后把带时间戳的源文件发给总监",e:{f:1,m:1,h:-1},rel:{lw:20,wk:-10},fb:["凌晨 2:14 的时间戳、图层记录、修改日志，一页页发过去。梁薇只回两个字：“收到。”","转正答辩那天，她把这封邮件投在大屏上。证据是好东西，但用它的人，会被人记很久。"]},
  {t:"不争，记住教训，下次先留痕",e:{m:1,he:1,h:-2},rel:{wk:5,lw:-5},fb:["你咽下这口气，从此所有稿件先发自己邮箱。方法论学会了。","可那晚回宿舍的路，你走了很久。忍是本事，忍多了伤身。你把《麦浪》的源文件存进加密盘，文件名改成一串无意义的数字——从那天起，你开始学会把真正重要的东西，藏起来。"]}]},
 {a:22,ci:1,bg:"bgOffice",tt:"第 8 关 · 女上司打压",q:"看见这一幕，你怎么做？",sc:[
  {s:"n",t:"转正了。总监梁薇却像换了个人：你的方案连打七版，批注一条比一条狠。"},
  {c:"lw",x:"angry",s:"o",t:"第七版，还是不行。就这？实习生水平。"},
  {c:"yl",x:"smug",s:"o",t:"啧，名校生也就这样嘛～"},
  {s:"os",t:"你开始怀疑自己。深夜十一点回办公室拿伞——总监办公室的灯还亮着。"},
  {s:"n",t:"百叶窗的缝里，她屏幕上放的是你的第三版。她戴着老花镜，一针一针改版型，改得比你还狠，也比你好。"},
  {cg:"cg4"},
  {s:"os",t:"白天骂你，深夜替你改图。这一行的水比你想的深——但至少，深处有灯。"}],
  o:[
  {t:"第二天直接闯办公室：“第三版到底哪里不行？”",e:{f:1,h:-1,m:1},rel:{lw:20,wk:-5,yl:-5},mom:"原来她半夜改的，是我的方案",fb:["她推过来一杯浓茶：“不行的是执行，不是创意。坐，我讲给你听。”","三个小时的课，值三年。她说“坐”的时候没看你——那是她的客气。代价是全组都记住了你是个“敢敲总监门的人”。敢的人，会被人记住，也会被人盯着。"]},
  {t:"装作没看见，偷偷学她的批注自己悟",e:{m:1,he:1,h:-1},rel:{lw:-5},fb:["你把七版批注按时间排开，摸出一套自己的版型方法论，本事进了自己兜。","只是你和她之间，永远隔着那道百叶窗。学会的东西是真的，错过的话也是真的。有些灯，你看见了，却没走进去。"]},
  {t:"申请调去别的项目组躲清静",e:{h:1,he:1,f:-2,m:-1},rel:{lw:-15},fb:["新组轻松，没人骂你也没人教你。半年后你听说，出国学习名额给了“能挨骂的那个”。","可那时候，已经不是你了。有些捷径，走完才知道是绕路。"]}]},
 {a:22,ci:1,bg:"bgOffice",tt:"第 9 关 · 男同事甩锅",q:"黑锅从天而降，U 盘在手，你怎么用？",sc:[
  {s:"n",t:"大货出事：三千件成衣色差，客户索赔 40 万。复盘会上，王凯调出一封“邮件”：“订单色号，是林小满确认的。”"},
  {c:"wk",x:"smug",s:"o",t:"小满还年轻嘛，犯了错要认。我建议从轻处理，以观后效。"},
  {s:"os",t:"全场的目光扎过来。你连夜查系统——那封“邮件”的时间戳，是伪造的。伪造的人手很巧，心思很脏。"},
  {s:"n",t:"散会后，采购部的江屿在楼梯间叫住你，塞来一个 U 盘：“原始邮件和系统日志，都在里面。”"},
  {c:"jy",x:"sad",s:"o",t:"我也要养家，不敢当众出头。敢不敢用，你自己决定。"}],
  o:[
  {t:"全员复盘会，当场甩出证据",e:{h:2,m:1,f:-1},rel:{wk:-20,lw:10,jy:10},mom:"一个 U 盘，把 40 万的黑锅甩了回去",fb:["大屏上系统日志一页页翻，王凯的脸从红到白——色差源头是他私自换的供应商。","他被调岗了。“不好惹”这个标签，你决定戴成勋章——勋章会招嫉妒，但至少是真的。"]},
  {t:"私下找王凯：“道歉，调组，二选一。”",e:{m:1,h:1,f:-1},set:{jy:1},rel:{wk:-10,jy:15},fb:["他盯着 U 盘看了半分钟，挤出一个字：“行。”","黑锅摘了，人没改——他只是换了个地方继续当王凯。江屿说你是他见过胆子最大的女生，你没接这句话。私下解决的事，往往只解决了表面。"]},
  {t:"把 U 盘交给梁薇，请她公断",e:{f:2,m:1,h:-1},rel:{lw:15,jy:5},fb:["梁薇只说了一句：“证据，要打在明处。”二次复盘，还你清白。","可你也记住了另一件事：从头到尾，你没敢自己握一次刀。刀在别人手里，永远只是别人的公道。后来你开始想：如果下次再有黑锅，你还愿不愿意把刀交出去？"]}]},
 {a:23,ci:1,bg:"bgOffice",tt:"第 10 关 · 深夜加班真相",q:"这一晚的真相，你接不接？",sc:[
  {s:"n",t:"冲刺月。凌晨一点，你回办公室拿落下的手机，听见总监办公室有动静。"},
  {s:"n",t:"门虚掩着。梁薇伏在桌上睡着了，手边三罐空咖啡。屏幕上是一份申报表——“金剪刀新锐奖 · 推荐人：梁薇；候选人：林小满”。"},
  {s:"os",t:"白天骂你最狠的人，深夜在替你报名。"},
  {s:"n",t:"桌角一张泛黄的合影，两个年轻姑娘站在缝纫机前笑。背面一行小字——青禾工作室，2005。"},
  {s:"os",t:"“青禾”？没听过。可照片里那台缝纫机的踏板，和你家那台一模一样——你家的那台，是从妈妈嫁妆里出来的。"}],
  o:[
  {t:"轻轻把冰咖啡换成热的，留张字条",e:{f:2,h:1,m:-1},rel:{lw:20},mom:"她的抽屉里，锁着我的推荐表",fb:["第二天她照常骂“第七版还是不行”，只是字条没了，热咖啡见了底。","年底推荐名单公示，你的名字排第一。有些人不说谢，用另一种方式还。"]},
  {t:"悄悄退出去，当没看见，第二天照常",e:{he:1,m:1,h:-1},rel:{lw:5},fb:["你装作无事发生，只把方案改得更狠。新锐奖提名照样来了。","只是“青禾”两个字像一根线头，勾在你心里，越拉越长——线头后面，也许是一件完整的衣服。你把它先绕在手指上，没急着扯。"]},
  {t:"第二天捧着问题清单主动请教",e:{m:2,f:1,he:-1},rel:{lw:15},fb:["她逐条讲完，忽然说：“你握剪刀的手势，像我一个故人。”","你追问是谁，她已转身去开会。故人这个词，比秘密轻，比答案重。你把这两个字记在本子最后一页，旁边画了一台缝纫机。"]}]},
 {a:23,ci:1,bg:"bgOffice",tt:"第 11 关 · 跳槽还是忍",q:"跳，还是忍？",sc:[
  {s:"n",t:"新锐奖提名公示当天，猎头电话打到工位：“对面公司，薪酬涨 40%，主设计师 title，明天给答复。”"},
  {c:"suit",n:"猎头",x:"smug",s:"o",t:"林小姐，青春没几年，别在锦绣耗着了呀。"},
  {c:"lw",x:"sad",s:"o",t:"（路过，停了三秒）要走，我不拦。金剪刀决赛，下个月。"},
  {s:"os",t:"一边是白花花的钱，一边是熬了两年的名字。梁薇的背影绷得笔直，像一株等风的麦。"}],
  o:[
  {t:"留下，打完决赛",e:{h:1,f:2,m:-1},rel:{lw:15},mom:"我留下了，把金奖捧回了锦绣",fb:["你回绝了猎头。备赛三十天，梁薇陪你改了 41 版。","领奖那天她比你还高兴，嘴上却是“早该如此”。有些师徒，不靠这句话。只是偶尔你会想：如果当时走了，名字还会不会是你的？"]},
  {t:"立刻跳槽，钱是尊严",e:{m:3,h:-1,f:-1},rel:{lw:-10},fb:["新公司到账短信很治愈。可决赛名单公示那天，你的名字后面跟着一行小字：（已离职，取消资格）。","有些站台，错过了就不再有——钱到账了，站台没了。你把到账短信存了很久，偶尔翻出来，看的不是数字，是那行小字。"]},
  {t:"谈判：留任可以，要独立带项目",e:{m:1,f:1,he:-2},rel:{lw:10},fb:["你把辞职信拍在桌上，又收回一半：“留，可以。给我独立项目组。”","梁薇盯着你十秒：“敢谈条件了。”条件拿到了，白头发也多了三根——谈判桌上长出来的，不止是条件。有些条件，是用身体付的利息。"]}]},
 {a:23,ci:1,bg:"bgOffice",tt:"第 12 关 · 第一次谈判",q:"第一次坐上谈判桌，你怎么打？",sc:[
  {s:"n",t:"决赛前夜，连锁商超临时变卦：砍价 30%，第八次改稿，还要求“参考某大牌”。"},
  {s:"n",t:"谈判桌对面坐着七个人，你这边只有你。梁薇全程喝茶，赛前塞给你一张纸条：先听，后说，让对方先出价三次。"},
  {c:"suit",x:"smug",s:"o",t:"小姑娘，就这个价，爱做不做。你们，又不是什么大牌。"},
  {s:"os",t:"手心全是汗。你想起爸爸的出租车——绕路的多，守表的更多。你摸了摸桌布，提花机织纹——妈妈册子里，有它的手织版。"}],
  o:[
  {t:"按纸条打太极，让对面先出三次价",e:{m:3,f:1,he:-1},rel:{lw:10,suit:-5},mom:"第一次谈判：降 8% 换两年长约",fb:["对面第三次报价后终于露底：他们也怕交期。你以“降 8% 换两年框架”收尾，当天签约。","电梯里梁薇三个字：“出师了。”纸条她没要回去——那上面还有下一场谈判的打法。被你涮了三次出价的客户，当场脸色不好看。出师那天，你第一次觉得：有些赢，是要付脸色的。"]},
  {t:"拍桌走人，方案不贱卖",e:{h:2,f:-1,m:-1},rel:{suit:-10,lw:5},fb:["“这个价格做出来，是砸我自己的招牌。告辞。”你出门时腿在抖，背挺得笔直。","单子飞了。可当晚客户采购总监私聊你：“下个预算高的项目，找你。”脾气值钱，但先得付得起。你把那条私聊截图存了下来——不是为了炫耀，是为了提醒自己：有些硬气，是要先亏一次的。"]},
  {t:"让一步签了，先拿决赛经验值",e:{m:1,f:1,h:-2},rel:{lw:5,suit:10},fb:["你签了让利合同，经验值拉满，庆功宴笑得很大声。","只有你知道那口气咽下去是苦的。苦东西咽多了，会成为胃的一部分。后来再坐谈判桌，你很少再让第一步。"]}]},
 {a:23,ci:1,bg:"bgCafe",tt:"第 13 关 · 被挖角",q:"橄榄枝和谜语同时递来，你接哪个？",sc:[
  {s:"n",t:"金剪刀决赛，你的《麦浪·成》拿了金奖。当晚，陌生号码约你喝咖啡——「拾光设计」创始人纪叙，圈内叫他老纪。"},
  {c:"lj",x:"happy",s:"o",t:"三倍薪水，独立工作室，作品永久署名。我想做的“新中式”，只有你能接。"},
  {s:"os",t:"条件好得像馅饼。你正要开口，他忽然盯着你握杯子的手，停了很久。"},
  {c:"lj",x:"sad",s:"o",t:"你握剪刀，虎口向内、小指压线的姿势——和一个老朋友，一模一样。她叫沈青禾。"},
  {s:"n",t:"咖啡的热气忽然就凉了。沈青禾——妈妈的名字，为什么会从一个陌生老板嘴里说出来？"},
  {c:"lj",x:"sad",s:"o",t:"来拾光。当年的事，我讲给你听。"}],
  hk:"<b>下一章预告 ·《爱情修罗场》</b><br>咖啡凉了，问题没凉：他到底是谁？妈妈到底是谁？——而此刻，楼下还有一个从柏林回来的人，拎着你八岁那年想要的东西。",
  o:[
  {t:"当场答应入职拾光",e:{m:2,f:2,h:-1},rel:{lj:20,lw:-10},mom:"挖我的老板，叫出了我妈妈的名字",fb:["“下周一入职。”老纪笑了，笑意没到眼底：“好孩子，有些故事得慢慢讲。”","那晚你失眠到天亮。妈妈，你到底还藏了多少？答案近在眼前，你却忽然不敢伸手去碰。"]},
  {t:"回绝：我的路自己走",e:{h:1,m:1,f:-2},rel:{lj:-5},fb:["“谢谢，但我想先靠自己站稳。”老纪不恼，敬了你一杯：“像。太像了。”","像谁？他不肯说。这个没接住的谜，跟了你三年——谜这个东西，你不接，它就自己长大。有时候你会想：如果当时问下去，会不会早一点知道真相？"]},
  {t:"先答应听我妈的事，offer 缓谈",e:{h:2,f:1,m:-1},rel:{lj:15},mom:"他一开口，就是我妈妈的名字",fb:["“钱可以慢点谈。我只想知道，您怎么认识我妈。”老纪沉默很久：“2005 年之后，我再没听到过她的消息——直到那年的讣告。”","这一夜，你把妈妈的旧照片翻到了天亮。有些答案来得太晚，晚到你已经学会了，先把刀收回鞘。"]}]},
]},
{no:3,name:"爱情修罗场",em:"💔",ages:"23 - 25 岁",sub:"青梅竹马、劈腿男友、旧爱回头——25 岁的题，超纲了。",cast:["man","cheng","lu","tian"],pre:"事业刚有点起色，爱情却排着队上门：一个从柏林回来，一个同床异梦，一个回头说抱歉。修罗场，开幕。",
 levels:[
 {a:23,ci:2,bg:"bgStreet",tt:"第 14 关 · 青梅竹马回国",q:"旧时光堵在楼下，你怎么办？",sc:[
  {s:"n",t:"加班到十点，公司楼下站着个高个子男人，风衣，行李箱，手里拎着一只铁皮青蛙。"},
  {c:"cheng",x:"happy",s:"o",t:"八岁那年你说，谁送你这只青蛙你就嫁给谁。柏林的跳蚤市场，我找了四年。"},
  {s:"os",t:"童年的巷子口忽然亮起了灯。手机在震：男友江屿第九个未接来电——你七小时前发过“加班别等我”。"},
  {c:"cheng",x:"norm",s:"o",t:"回国接老城区旧改项目，至少三年。顺便——看看你过得好不好。"},
  {s:"n",t:"他手腕上还系着你小学二年级编的红绳，洗得发白，没断。"}],
  o:[
  {t:"收下铁皮青蛙，请他吃了碗面",e:{h:2,f:1,m:-1},set:{cy:1},rel:{cheng:20,jy:-10},mom:"他找回了 我八岁那年想要的那只青蛙",fb:["面馆热气里，他说柏林的雪，你说锦绣的班。末了他忽然说：“你家巷口那个总在裁东西的阿姨——是你妈妈吧？她裁布的样子，我一直记得。”","走到楼下，江屿的电话又来——你按掉的那一秒，心里咯噔了一下。青蛙是旧的，心事是新的。"]},
  {t:"保持距离：“我有男朋友了。”",e:{h:-1,f:-1,he:1},rel:{cheng:-5,jy:5},fb:["程野笑笑，把青蛙塞进你手里：“留着，不用嫁。”","那晚江屿夸你“懂事”，你却莫名发闷。发闷的原因，你不敢想。有些距离，是给别人的，也是给自己的。"]},
  {t:"拉甜甜陪着你一起见",e:{h:1,f:2,m:-1},rel:{tian:10,cheng:10},fb:["三人吃了顿火锅，甜甜全程盯着程野，眼睛亮晶晶：“他好帅啊，还是建筑师……”","你笑着打哈哈。有些哈哈，打给谁听，你自己知道。后来回想，那顿火锅里埋的线，比你当时看见的更长。"]}]},
 {a:23,ci:2,bg:"bgDorm",tt:"第 15 关 · 劈腿实锤",q:"天塌了，怎么掀桌？",sc:[
  {s:"n",t:"江屿最近总在“加班”。甜甜欲言又止了三次。深夜，陌生账号 @你，甩出九宫格：三亚，游艇，江屿的手环着顾曼妮的腰。"},
  {cg:"cg5"},
  {c:"gu",x:"smug",s:"o",t:"别怪他呀，他没骗你——他骗的是“会一直穷下去的你”。对了，服务他三年的报酬，我付得很足哦。"},
  {s:"os",t:"三年？你们才在一起一年半。原来连开始，都是明码标价。"},
  {s:"n",t:"你翻到聊天记录最后一条：江屿向顾曼妮汇报你的设计稿进度——《麦浪·成》终稿，出现在“曼妮可”的新品企划里。"},
  {s:"os",t:"好啊。感情是假的，商业间谍是真的。你把眼泪咽回去的动作，和妈妈当年收针的动作一样——利落，不叫人看见。"}],
  o:[
  {t:"冲去他家当面对质",e:{h:-2,f:1,he:-1},rel:{jy:-30,gu:-15},mom:"他对不起我的方式，是标价五十万",fb:["你把门拍得砰砰响，他开门就跪：“她给的太多了，小满，五十万啊！”","甜甜连夜赶来抱住你。眼泪流干的那个晚上，你把所有终稿加了密——从今往后，稿子的密码比人心可靠。"]},
  {t:"冷静取证，体面分手",e:{m:1,h:-1,f:1},rel:{jy:-20,tian:10},mom:"体面分手，顺手送他一张律师函",fb:["转账记录、酒店流水、泄露日志，打包发律师和风控。分手短信两个字：“再见。”","锦绣开除江屿，曼妮可收律师函。你输了爱情，赢了体面——体面这个东西，失去过一次才知道它多贵。"]},
  {t:"先找甜甜：“你是不是早知道？”",e:{h:-2,f:-2,m:1},rel:{tian:-15},fb:["甜甜哭着说看到过一次，怕你受伤，也怕你误会她挑拨。你懂，但你还是难受。","那一个月，你和甜甜的聊天框停在“晚安”。信任碎过一次的地方，最怕再被碰到。有些话问出口的瞬间，答案已经不重要了。"]}]},
 {a:23,ci:2,bg:"bgStreet",tt:"第 16 关 · 前任的伞",q:"这把伞，接不接？",sc:[
  {s:"n",t:"分手第七天，暴雨。楼下站着陆之遥，研究院工牌淋得半湿，手里两把伞，一把都没撑。"},
  {c:"lu",x:"norm",s:"o",t:"大学那句话，我一直没说完。今天补上——当年评议会我不敢投你，是因为顾家捏着我姐的助学金名额。"},
  {c:"lu",x:"sad",s:"o",t:"后来我匿名举报过奖学金的事，石沉大海。对不起，那时候的我，太没用了。"},
  {s:"os",t:"雨声很大。原来那三秒的犹豫里，藏着一个没敢说的保护，和一场无声的反击。雨里你想起妈妈接送你上学的伞——她总把伞面往你这边偏。"},
  {s:"n",t:"他把伞递过来：“不复合也没关系。这句话，憋了五年。”"}],
  o:[
  {t:"接伞，听他说完那个五年的故事",e:{h:2,f:1,m:-1},set:{zy:2},rel:{lu:20},mom:"那把没撑开的伞，憋了五年",fb:["面馆里他讲完这五年：读研、攒钱、给姐姐换病房。末了问“能重新开始吗”，你没答，只把面汤喝完了。","有些答案留给时间——面凉得慢，答案凉得快，你选了让它们一起慢慢热。"]},
  {t:"伞收下，人拒绝：“过去就过去。”",e:{h:1,he:1,f:-1},rel:{lu:5},fb:["“谢谢，也再见。”他笑了笑，把伞塞给你就走。","伞骨上刻着一行小字：给小满。你用了很多年，一次也没修过——它一直没坏。有些东西不坏，是因为没人舍得用坏它。你把伞收进柜子最里面，很少再拿出来。"]},
  {t:"告诉他：“我现在只想搞事业。”",e:{m:2,f:1,h:-1},rel:{lu:15},fb:["他愣了两秒，认真点头：“那我排队。”","从此你的深夜加班多了一份宵夜。你说不清这算什么——没名目的债，最难还。有时候你会想：排队的人，等的到底是你，还是一个他想象中的你？"]}]},
 {a:24,ci:2,bg:"bgCafe",tt:"第 17 关 · 闺蜜抢人",q:"闺蜜的眼泪，你接还是不接？",sc:[
  {s:"n",t:"甜甜约你在老地方喝糖水，搅了半天珍珠，终于憋出一句——"},
  {c:"tian",x:"sad",s:"o",t:"小满，程野……我喜欢他。从火锅那次就喜欢了。我知道不该，可我这辈子，没为自己要过一次东西。"},
  {s:"os",t:"糖水店的粗瓷勺，跟你从老家带来的那把是一模一样的批发货。你想起妈妈用它喂你糖水的样子——那时候，东西和人都不会中途换人。"},
  {s:"n",t:"你还没消化，手机弹出程野的消息：“明早给你送早饭，想吃什么？”"},
  {c:"tian",x:"sad",s:"o",t:"你条件比我好，什么都比我好……就当，就当我求你一次，好不好？"}],
  o:[
  {t:"撮合他们，把自己的心动咽下去",e:{f:1,h:-2},rel:{tian:10,cheng:-10},mom:"我把心动咽了下去",fb:["你给程野发消息：“甜甜人很好，多接触接触。”按下发送那刻，心口像被拔掉一块。","三个月后他们没成——程野只回了句“我等的人不是她”，然后继续给你送早饭。咽下去的东西，不会消失，它只是在等你消化。有些好心，最后成了三个人的累。"]},
  {t:"说清楚：“感情不能让，但我祝你们公平竞争。”",e:{h:1,f:-1,he:1},rel:{tian:-10},fb:["“我不喜欢‘让’这个字。他不是东西，我也不是。”甜甜哭着跑了。","三天后她发来消息：“对不起，是我不讲理。糖水我请。”裂痕补上了，胶水的痕迹还在。你俩后来很少再提程野的名字。"]},
  {t:"拉上程野，三个人当面说开",e:{h:1,f:2,he:-1},rel:{tian:5,cheng:5},mom:"三人局说开那天，没有赢家，只有诚实",fb:["程野听完，看着你、却对着甜甜说：“我心里有人，一直有。抱歉。”","甜甜哭着跑了，程野追出去——回来只说一句：“送她到家了。”成年人的修罗场，没有赢家，只有诚实。诚实之后，有人会少来一次糖水店。"]}]},
 {a:25,ci:2,bg:"bgVenue",tt:"第 18 关 · 订婚宴反转",q:"大屏幕炸了，你的台词是什么？",sc:[
  {s:"n",t:"一年后，程野还是开了口。订婚宴设在老饭店，两边亲友十二桌，你穿着租来的婚纱，紧张得像高考——领口缝着一圈手工丝线，你一眼就认出了手工：妈妈的手艺眼。"},
  {s:"n",t:"交换戒指环节，大屏幕黑了三秒——再亮起时，是你和陆之遥大学时的合影，接着一段录音：“她还联系前任，这种女人……”是江屿的声音。"},
  {c:"suit",n:"宾客",x:"smug",s:"o",t:"（全场哗然）嗡——这是怎么回事？！"},
  {c:"gu",x:"smug",s:"o",t:"（朋友圈同步发文）恭喜某人，订婚都订得这么热闹呀～"},
  {cg:"cg6"},
  {s:"n",t:"程野拿起话筒，很平静：“照片是五年前的毕业照。录音是上周录的——江先生，分手一年了还这么闲？”他转向你，单膝还跪着：“戒指还在。你说了算。”"}],
  o:[
  {t:"牵起他的手：“今天这场，继续。”",e:{h:2,f:1,he:-1},set:{engaged:1},rel:{cheng:25},mom:"订婚宴被炸场，我把戒指戴了回去",fb:["戒指滑进无名指那一刻，掌声压过议论，顾曼妮的评论区翻车成道歉现场。","至于程野妈妈那一关——留到婚后慢慢熬。婚是你们俩的，考题是全家的。"]},
  {t:"先安抚程野妈妈：“妈，给您一个交代。”",e:{f:2,h:1,m:-1},set:{engaged:1},rel:{cheng:10},fb:["你没看大屏，先走到婆婆面前鞠了一躬：“今天让您受惊了，改天我挨桌赔罪。”","老太太愣了半天，拂袖的手放下了。婚宴继续，只是你后背的婚纱全湿透。守住场面的代价，是没有人看见你发抖。"]},
  {t:"摘下头纱：“这婚，换个日子结。”",e:{h:1,m:1,f:-2},rel:{cheng:15},mom:"我摘下头纱：这婚，换个日子结",fb:["“我不想在被闹剧绑架的日子定终身。”你走出饭店，夜风一吹，眼泪才敢掉。","程野追出来把外套披给你：“我等。哪天都行。”这局你输了排场，赢了自己的日子——日子比排场大。"]}]},
 {a:25,ci:2,bg:"bgRooftop",tt:"第 19 关 · 自己选还是都不选",q:"25 岁，爱情这道题你填什么？",sc:[
  {s:"n",t:"风波后一个月。程野的短信：“下月回柏林半年。不用急着答复，我等得起。”"},
  {s:"n",t:"陆之遥的消息：“我可以等，也可以只做朋友。你定。”"},
  {s:"n",t:"江屿的短信第九次弹出来。这一次，你终于按下了拉黑。"},
  {s:"n",t:"深夜天台，风很大，城市的灯火像一片倒过来的麦田。"},
  {s:"os",t:"25 岁了。所有人都在问我选谁。可我真正想问的是——我有没有资格，先选一次自己？那封“给小满”的信还在箱底。有些答案，25 岁还不到拆的时候。"}],
  hk:"<b>下一章预告 ·《家族秘密》</b><br>你还没想好答案，舅舅的电话先来了，声音发抖：“小满……你外婆走了。老宅下月拆，你妈那些旧东西，你回来看一眼吧。”",
  o:[
  {t:"选程野：麦田和灯火，都要",e:{h:2,f:1,he:1,m:-1},set:{love:"cy"},rel:{cheng:20,tian:5},mom:"25 岁，我选了那个找青蛙的人",fb:["你给程野发语音：“柏林冷，带我的围巾。”那头沉默三秒，一声很轻的“好”。","甜甜第一个留言祝福——她现在管程野叫“哥”，叫得挺顺口。旧伤长成了新称呼。可你后来偶尔会想：如果当时再多撑三个月呢？"]},
  {t:"选陆之遥：迟到五年的那句话",e:{h:1,f:1,m:1,he:-1},set:{love:"zy"},rel:{lu:20},mom:"25 岁，我接过了迟到五年的那把伞",fb:["“那把伞，我还留着。”你发出这句话，他秒回：“我马上下楼。”研究院到你这里 23 公里，他骑了四十分钟。","迟到五年的人，往后每一步都在赶来的路上。只是有些路，一旦踏上，就再也回不到独自走的节奏了。"]},
  {t:"都不选——先成为林小满",e:{m:2,h:1,he:1,f:-2},set:{love:"none",solo:1},rel:{cheng:5,lu:5,tian:-5},mom:"25 岁，我先选了自己",fb:["你在天台吹了两个小时风，给两个人回了同一句话：“先做朋友。我要先把自己活明白。”","全世界说你疯了。只有你自己知道：这一格空白，是你 25 岁给自己买过最贵的奢侈品——也是最贵的赌。"]}]}
]},
{no:4,name:"家族秘密",em:"🗝️",ages:"25 - 27 岁",sub:"妈妈的旧箱子里，锁着另一个名字。",cast:["man","dad","hls","lj"],pre:"外婆走了，老宅要拆。樟木箱打开的那天，你的人生剧本被换了一本——妈妈的名字后面，藏着另一个名字。这一章是全剧的魂：秘密揭露的过程，同时推进真相，和人心。",
 levels:[
 {a:25,ci:3,bg:"bgHome",tt:"第 20 关 · 手稿被发现",q:"妈妈留下的箱子，你怎么接？",sc:[
  {s:"n",t:"老宅奔丧第三天，舅舅指着阁楼：“你妈的嫁妆箱子，搬走还是烧了，你爸说等你来定。”"},
  {s:"n",t:"樟木箱打开：十二本发黄的手绘册、一沓打版纸、一枚顶针、一把小剪刀。每本扉页同一个签名——沈青禾，字迹清瘦有力。"},
  {c:"dad",x:"sad",s:"o",t:"你妈走前说，等你哪天靠这行吃饭了，再给你。现在……拿着吧。"},
  {s:"os",t:"你翻开第一册，呼吸停了半拍：麦穗纹、活线锁边、双层压线——你大学画了四年的那些“灵光一闪”，一页一页，全在这里。"},
  {cg:"cg7"},
  {s:"n",t:"箱底压着一封没拆的信，信封上是妈妈的字：给小满。爸爸的手按住了它：“这封，再等等。”"}],
  o:[
  {t:"连夜把十二册全部翻完",e:{h:2,m:1,he:-2},set:{ms:1},rel:{dad:10},mom:"我连夜翻完了妈妈的十二本手绘册",fb:["天亮时你眼睛肿得睁不开，脑子里炸开了烟花——原来你引以为傲的“天赋”，是血脉里的师承。","妈妈，你到底还藏了多少？最后一册的最后一页只有半句话，剩下一半，被水渍晕开了。"]},
  {t:"先收好，等心静了再看",e:{he:1,h:1,f:-1},set:{ms:1},rel:{dad:5},fb:["你把箱子锁回原处，守灵七天，一次没开。","不是不敢看，是怕看一眼——就得重新认识妈妈一次。有些重逢，需要仪式感。"]},
  {t:"拍照发给老纪请教",e:{f:2,m:-1,h:-1},set:{ms:1},rel:{lj:10,dad:-5},mom:"我把箱子的照片发给了老纪",fb:["老纪半夜回电，声音发抖：“原件！千万别示人！尤其——别让姓贺的看见。”","姓贺的？谁？他没解释就挂了。那晚你把箱子塞进床底最深处——床底下，是这世上最黑的保险箱。"]}]},
 {a:25,ci:3,bg:"bgStreet",tt:"第 21 关 · 亲戚争遗产",q:"亲戚上门，怎么守住箱子？",sc:[
  {s:"n",t:"你在朋友圈晒了一页手绘册，配文“妈妈的字”。三天后，舅妈带着两个表哥堵在出租屋楼下。"},
  {c:"jm",x:"smug",s:"o",t:"老宅拆迁款有你一份就有我们一份！那箱子是沈家的东西，得归公、评估！"},
  {s:"n",t:"混乱中你听见舅妈压低声音打电话：“对对，就是‘青禾’的东西……行，五十万以内都能谈……”"},
  {s:"os",t:"青禾？又是这个词。一个连搜索引擎都只给几行字的名字，凭什么值五十万？"},
  {c:"jj",x:"sad",s:"o",t:"（拉你到一边，声音发虚）小满，你舅妈娘家那边，最近在打听一个叫“青禾”的人的东西……你上点心。"}],
  o:[
  {t:"请律师做遗物公证，正面刚",e:{f:2,h:1,m:-2},rel:{jm:-25,jj:10},mom:"一张律师函，挡住了五十万的算盘",fb:["律师函发出去，“评估小组”当场散伙。按手印时你的手在抖——第一次用规则保护自己。","律师费八千。贵吗？你算了算妈妈那十二册册子的分量——不贵。只是从那天起，家族群里再没人叫你“小满”。"]},
  {t:"稳住舅妈：“估价之后，该分的分。”",e:{h:-1,f:1,m:1},rel:{jm:-10},fb:["你陪着笑搪塞过去，转头把八册转移到爸爸那里。兵不厌诈。","只是从此，你在家族群里成了“心机最深的外甥女”。名声这东西，护宝的时候最先烧掉。你把那八册锁进保险柜，钥匙只给了爸爸一把。"]},
  {t:"带着箱子搬去公司宿舍，物理隔离",e:{m:1,he:1,f:-2},rel:{jm:-15,jj:-5},mom:"家族群把我移出了群聊",fb:["你拎着箱子住进公司宿舍，家族群把你移了出去。箱子保住了。","可“家”这个字，也碎了一角。有些保护，是以疏远计费的。你偶尔还会打开那个群，看一眼最后一条消息的时间。"]}]},
 {a:25,ci:3,bg:"bgContest",tt:"第 22 关 · 对手出现",q:"这个女人的眼神不对劲，你怎么办？",sc:[
  {s:"n",t:"新锐设计周。布展时，手绘册的一页复印件混进了你的 moodboard——你发现时，评委已经进场。"},
  {s:"n",t:"评委席正中的女人：珊然集团董事长、设计协会会长——贺兰珊。她在那页纸前站了十秒，墨镜滑下一半。"},
  {c:"hls",x:"smug",s:"o",t:"姑娘，这页原图，在谁手里？"},
  {c:"man",x:"norm",s:"m",t:"……在我手里。"},
  {c:"hls",x:"smug",s:"o",t:"好好收着。别让它落到不该落的人手里——比如，落到我手里。"},
  {s:"os",t:"她走后你后背全湿了。那不是欣赏。那是猎人看见幼崽的眼神——而猎人不急着扑，猎人喜欢看你长大。"}],
  o:[
  {t:"追上去问：“您认识画这画的人？”",e:{f:1,h:1,he:-1},rel:{hls:-5},fb:["她脚步没停：“认识？我们那时候，可太‘认识’了。”话头到此为止。","她的助理回头看了你一眼——那眼神，像在给一件商品估价。你忽然明白：有些问题，问出口的瞬间，就已经被记进了别人的账本。"]},
  {t:"面不改色：“家母习作，让会长见笑。”",e:{m:1,h:1,f:-1},rel:{hls:-5},fb:["“习作？”她轻笑一声走了。当晚，你的参赛作品评分被复核三次——三次都是第一。","没人动得了你。也没有人，看不见你。被看见，是保护，也是标价。你把那页复印件从 moodboard 上取下来，锁进了抽屉最里面。"]},
  {t:"让老纪去查她的底细",e:{f:2,m:-1,h:-1},set:{know:1},rel:{lj:-5,hls:-10},fb:["三天后老纪约你，桌上放着一份 2005 年的旧报纸：“当年‘青禾’退圈，和这位会长，脱不了干系。”","“小满，从今天起，你妈的事就是你的事——想清楚，再踏进来。”你把那份报纸看了三遍，才敢合上。"]}]},
 {a:26,ci:3,bg:"bgContest",tt:"第 23 关 · 决赛黑幕",q:"身份炸开在这一刻，你的第一反应？",sc:[
  {s:"n",t:"决赛。你的作品叫《小满》：麦穗纹，手工双层锁边——妈妈册子里的手艺，你的名字。"},
  {s:"n",t:"评分公示前一小时，会场广播炸了：3 号选手涉嫌抄袭“青禾 2005 年经典纹样”，附当年《织物》杂志图版。镜头，呼啦啦全对准你。"},
  {cg:"cg8"},
  {c:"teach",x:"angry",s:"o",t:"抄袭是行业底线！建议取消资格！"},
  {s:"n",t:"大门被推开。老纪拿着一沓文件冲进来——"},
  {c:"lj",x:"angry",s:"o",t:"抄袭不成立！因为评委席上没有人比她更有资格用这个纹样——青禾，沈青禾，是她的母亲！"},
  {s:"os",t:"死寂三秒，镁光灯炸成一片白。妈妈。缝纫机前坐了半辈子的妈妈……和那个凭《惊鸿》惊艳全国、两年后人间蒸发的天才“青禾”，是同一个人？"}],
  o:[
  {t:"上台接过话筒：“我是青禾的女儿，也是林小满。”",e:{h:2,f:2,he:-1},set:{claim:1},rel:{hls:-15,lj:15,lw:10},mom:"我站上台说：我是青禾的女儿",fb:["“纹样是我妈妈的，手艺也是。抄袭名单上可以有两个名字，获奖名单上——我只写林小满。”","全场起立，热搜挂了一夜。你成了话题中心。靶心，也是中心。你后来才明白：站上中心的那一刻，就再也下不来了。"]},
  {t:"沉默退场，回家逼问爸爸",e:{h:1,f:-2,m:1},set:{ask:1},rel:{dad:10},fb:["你从后门离开，直奔老家。爸爸蹲在门槛上抽了半包烟：“瞒了你二十年……她不让说。她说，这行会吃人。”","这行会吃人。那妈妈——是被谁吃了？你把这个问题问出口的时候，爸爸的烟头烫到了手指。"]},
  {t:"当场申请调取 2005 年决赛档案",e:{f:1,m:1,h:-1},set:{arch:1},rel:{hls:-10,lj:5},fb:["“说我抄袭？请公示 2005 年决赛的原始评分单。”评委会面面相觑——档案，“遗失”了。","贺兰珊在评委席轻轻鼓了两下掌：“小姑娘，胆子不小。”从这一刻起，你正式上了她的名单。名单这个词，你已经不陌生了。"]}]},
 {a:26,ci:3,bg:"bgStudio",tt:"第 24 关 · 手稿真假鉴定",q:"鉴定这场仗，怎么打？",sc:[
  {s:"n",t:"一夜之间，全网吵翻。#青禾女儿# 挂了三天热搜。贺兰珊资助的营销号带节奏：“手稿墨迹太新，疑似伪造”“恰饭剧本，建议查税”。"},
  {c:"lj",x:"norm",s:"o",t:"纸龄、墨水批次、笔迹比对《织物》存档底稿——三关，一关都不能缺。做吗？"},
  {c:"lw",x:"sad",s:"o",t:"（深夜发来消息）我陪你。当年……我也在场。"},
  {s:"os",t:"她怎么会在场？她才多大？……真假不由我说，也不由热搜说。可这一仗躲不掉——躲了，妈妈的名字就永远是脏的。"}],
  o:[
  {t:"全程直播鉴定，透明到底",e:{f:3,h:1,m:-1},set:{open:1},rel:{xu:10,hls:-20},mom:"800 万人围观下，妈妈的名字被洗干净了",fb:["三机位直播：纸龄、墨水光谱、笔迹比对。底稿放上比对台那刻，弹幕静了五秒——同一只手的字。","妈妈的名字，在光里，一点点干净起来。有些干净，迟到二十年，还是要还。可还完之后，你忽然不知道自己该站在哪。"]},
  {t:"只走官方程序，不吃流量",e:{m:1,he:1,h:-1},rel:{hls:-10},fb:["你拒绝直播，只接受行业协会封闭鉴定。稳妥、专业。","但“伪造论”又狂欢了两周。妈妈的老粉丝在评论区替你挨骂，你一条都回不了——透明有透明的代价，沉默有沉默的账单。你把那些骂人的截图存了下来，没有删。"]},
  {t:"拒绝鉴定：“我妈妈的真假，轮不到热搜说了算。”",e:{h:2,f:-3},rel:{hls:-5},fb:["你发微博：“青禾是谁，2005 年发生了什么，去问活着的人，别问一张纸。”","舆论炸了：骂你心虚的、赞你硬气的吵成一团。只有你知道——你是在赌。赌物证之外，还有人证。赌输了，妈妈的名字就真的脏了。"]}]},
 {a:27,ci:3,bg:"bgStudio",tt:"第 25 关 · 公开还是藏起",q:"手稿处置，你的决定？",sc:[
  {s:"n",t:"鉴定结论公布：真迹。纸张为 2003 年产图纸纸，墨水批次吻合，笔迹与《织物》底稿同一人。行业震动。"},
  {s:"n",t:"博物馆来谈收藏，出版社来谈画册，品牌方捧着钱谈联名。樟木箱摆在新工作室正中央——十二册，一册不少。"},
  {c:"dad",x:"happy",s:"o",t:"（电话里，难得话多）小满，你妈要是能看见……算了，不说了。早点睡。"},
  {s:"os",t:"妈妈，你这一生没走完的路，接下来我替你选。公开，全世界都会看见你；藏起，就只有我一个人的凌晨知道。可我突然害怕——公开之后，她就不再只是我的妈妈了。"},
  {cg:"cg11"}],
  hk:"<b>下一章预告 ·《三十而立》</b><br>当晚十一点，工作室的玻璃门碎了一地。樟木箱开着——十二册，只剩三册。爸爸的电话同时打进来，声音发抖：“小满，别报警，先回来。我看见偷东西的人了……我认得那张脸。”",
  o:[
  {t:"公开！办“青禾手稿回顾展”+ 出版画册",e:{f:3,m:2,he:-2},set:{publish:1},rel:{dad:15,lj:10},mom:"三百米的队，排给迟到了二十年的青禾",fb:["开展那天排了三百米的队。有人临摹，有人流泪，一位白发老人在《惊鸿》图前敬了个礼。","妈妈，你看。大家没有忘记你。可从这一天起，你也不再只是我的妈妈——你成了行业的符号。我把你交出去了。"]},
  {t:"原件封存进保险箱，只授权复刻出版",e:{m:3,h:1,f:-1},set:{seal:1},rel:{dad:5},fb:["原件进了保管箱，只出复刻画册。安全，赚钱，稳妥。","评论区最高赞：“什么时候能看到原稿？”你回不了。有些保护，在别人眼里是封锁；在你心里，是最后一点私心。"]},
  {t:"捐给服装博物馆，一分不留",e:{f:2,h:2,m:-2},set:{donate:1},rel:{dad:15},mom:"我把妈妈捐给了她爱的行业",fb:["“青禾属于这个行业，不属于我。”捐赠仪式上你没哭，回家抱着空箱子哭到凌晨。","爸爸坐在对面陪了你一夜，没说话——他懂：给出去的是册子，留下来的才是女儿。可你后来偶尔会想，如果当时再自私一点呢？"]}]}
]},
{no:5,name:"三十而立",em:"🏆",ages:"28 - 30 岁",sub:"把妈妈没走完的路，走给她看。",cast:["man","dad","hls","tian"],pre:"手稿被盗、爸爸看见那张脸、贺兰珊步步紧逼。28 岁的你站在分岔口：这一次不是选择怎么活，而是选择——成为谁。",
 levels:[
 {a:28,ci:4,bg:"bgCafe",tt:"第 26 关 · 工作室还是大厂",q:"立业的岔路口，你走哪边？",sc:[
  {s:"n",t:"案子悬而未破，生活得继续。老纪把合伙人协议推到你面前：“拾光的门，一直开着。”"},
  {c:"lj",x:"norm",s:"o",t:"来拾光，大树底下好乘凉。自己开？风大的时候，连伞都没有。"},
  {s:"n",t:"同一天，你的存款刚好够付一间小铺面的押金。钱包里除了卡，还有妈妈那三本幸存手稿的照片。"},
  {s:"os",t:"28 岁了。安稳的路和自己的路，总得选一条，走到底。"}],
  o:[
  {t:"进拾光做合伙人",e:{m:3,f:2,h:-1},set:{path:"big"},rel:{lj:20},fb:["大平台，老纪罩着，项目喂到嘴边，你很快带起二十人的团队。","只是深夜路过楼下独立工作室的橱窗，你总会多看两眼。乘凉的人，偶尔也会想自己种树。"]},
  {t:"开「小满工作室」，单干",e:{h:2,m:1,f:-2},set:{path:"own"},rel:{dad:10,lj:-5},mom:"小满工作室，开张了",fb:["押金一付，招牌一亮。第一个月只接到两单，你蹲在门口吃盒饭，心里却踏实得想哼歌。","这方寸之地，是你自己挣来的人生——妈妈那三本手稿的照片，就贴在招牌背面。有些盒饭，吃起来比宴席更香。"]},
  {t:"工作室 + 挂靠拾光，两头借力",e:{m:1,f:1,he:-1},set:{path:"both"},rel:{lj:10},fb:["老纪笑骂你“滑头”，还是签了合作。你有了自己的门面，也有了大树。","只是两头跑的你，体检报告多了两个箭头——借力是有利息的，付账的是身体。你把报告单折进钱包，和妈妈手稿的照片放在一起。"]}]},
 {a:28,ci:4,bg:"bgOffice",tt:"第 27 关 · 被资本压价",q:"压价四成，怎么谈？",sc:[
  {s:"n",t:"“曼妮可”找上门谈联名合作。顾曼妮剪了短发，坐在谈判桌主位，开口就砍价四成。"},
  {c:"gu",x:"smug",s:"o",t:"没了你妈手稿的热度，你算什么？三个月就过气的网红而已。四成，爱签不签。"},
  {s:"n",t:"她助理倒水时手抖了一下，一张便签滑到你这边：「她被她姨母逼着来的。姨母，姓贺。」"},
  {s:"os",t:"姨母姓贺。顾曼妮眼里那点没熬掉的疲惫，突然和“棋子”两个字，重合了。"},
  {c:"gu",x:"sad",s:"o",t:"（低声，几乎自言自语）你知不知道……被人捏着手腕活着的滋味。"}],
  o:[
  {t:"拍桌走人：“小满不卖，青禾更不卖。”",e:{h:2,f:-1,m:-1},set:{mn:1},rel:{gu:-20,hls:-10},mom:"我推回了那张压价四成的合同",fb:["你推回去的动作干净利落。三个月后“曼妮可”抄袭小样流出、口碑崩盘——你的独立新品卖断了货。","顾曼妮深夜发来三个字：“算你狠。”你盯着这三个字看了很久——你们到底算不算敌人？有些对手，恨起来，也像在恨一面镜子。"]},
  {t:"压回原价 + 销售分成对赌",e:{m:4,f:1,he:-1},rel:{gu:-10,hls:-15},mom:"一场对赌，我赢回 8% 的人生",fb:["“价格回去，另加 8% 销量对赌。赌不赌？”她盯着你十秒，忽然笑了：“跟你妈一样，难缠。”","联名大卖。销量到账那天，你给爸爸换了台新车。你没告诉他，那笔钱里有一半，是和对头赌回来的。"]},
  {t:"放弃联名，转头接小单养团队",e:{h:1,f:2,m:-1},set:{small:1},rel:{gu:-5,tian:5},fb:["大单让给资本，你回去接散单：学生毕设、社区改造、老字号焕新。不赚钱，赚口碑。","三个月后，这些“小单”里的三家，成了你未来十年的老客户。口碑是慢钱，慢钱不坑人。你把那三家的名片钉在工位上方，像钉了一排钉子。"]}]},
 {a:29,ci:4,bg:"bgStudio",tt:"第 28 关 · 直播带货翻车",q:"直播翻车夜，怎么救？",sc:[
  {s:"n",t:"现金流吃紧，你开直播带货自救。第三场，在线八万人，团购链接刚上架——弹幕炸了：“面料是假的！”"},
  {s:"n",t:"供应商掺了 30% 化纤混纺，检测报告在热搜挂了一整夜。掉粉五万，评论区全是“人设崩了”。"},
  {c:"zl",x:"sad",s:"o",t:"姐，公关稿写好了：供应商全责，我们也是受害者……发吗？"},
  {s:"os",t:"深夜你盯着镜子。认，还是不认？装受害者，还是把伤口摊开？"}],
  fl:[{ifF:"he3",t:"🍋 幸好当年便利店那位的许主编还在。他深夜发来消息：“检测报告发我。当年青禾也被这么泼过脏水——这次，我帮你把水搅清。”"}],
  o:[
  {t:"第二天直播开箱：含泪复盘全流程",e:{h:1,f:3,m:-1},rel:{tian:10,xu:10},mom:"一场翻车直播，我把它开成了道歉会",fb:["你把合同、入库检测、自家留样一页页摆上直播桌，最后鞠躬：“这一单，小满全赔。”","弹幕从骂声刷成“退货免了，支持”。掉的分，一周涨了回来——认错不丢人，丢人是不认。你把那晚的直播回放存进硬盘，文件名写了两个字：学费。"]},
  {t:"直接起诉供应商，法庭见",e:{m:2,f:1,h:-1},rel:{dad:5},mom:"我把供应商告上了法庭",fb:["律师函、财产保全、公开庭审。你赢了：赔款到账，供应商被行业封杀。","可“小满被告”的词条挂了两个月。真相赢了，热搜没输——法庭是干净的，围观不是。你后来很少再提那场官司，只是质检单多了一栏：供应商背景。"]},
  {t:"停播一个月，闭门复盘",e:{he:1,h:1,m:-2,f:-1},rel:{dad:10},mom:"停播三十天，我重造了一条质检链",fb:["你按下暂停键，重立质检流程：三检入仓、留样封存、直播实拍。一个月后复播，在线人数腰斩——","但从此“小满出品”四个字，再没翻过车。慢下来的一个月，买断了往后所有的翻车。有些停，是为了以后不用再停。"]}]},
 {a:29,ci:4,bg:"bgContest",tt:"第 29 关 · 旧敌最后的打压",q:"最后的决战，怎么打？",sc:[
  {s:"n",t:"贺兰珊开发布会，白发红唇，掷地有声：“2005 年《惊鸿》原创是我，青禾才是抄袭者。”她当场出示“1999 年手稿”，纸页泛黄，签名清晰。"},
  {s:"n",t:"同一天，警方通报：手稿被盗案告破——舅妈开的门，收款 50 万，买家是“珊然集团品牌部顾问”。九册被追回，三册流向海外拍卖行。"},
  {c:"hls",x:"smug",s:"o",t:"（面对镜头微笑）顾问个人行为，与珊然无关。倒是有些人，消费亡母炒热度——其心可诛。"},
  {s:"os",t:"她把自己择得干干净净，把脏水泼向妈妈。最后一战，来了。"},
  {cg:"cg9"}],
  fl:[{ifF:"he4",t:"📼 你从保险柜取出旧物市场淘来的那盘录像带——2005 年决赛全场记录。带子里，评委念出金奖得主之前，后台有人递进去一张纸条。"}],
  o:[
  {t:"发布会现场对峙，当众放证据",e:{h:2,f:2,m:-1},rel:{hls:-25,lj:10},mom:"我踹开了她发布会的门",fb:["你推开发布会大门，把鉴定书和警方通报拍在台上：“抄袭者的女儿？不——我是被盗者的女儿。”","当晚，“青禾”两个字搜索量破亿。贺兰珊那份“1999 年手稿”，墨迹鉴定结果：2024 年。你赢了。可你站在台上的时候，忽然很想问问妈妈：这样赢，算不算赢？"]},
  {t:"律师函 + 刑事并进，不见面",e:{m:1,f:1,he:1,h:-1},rel:{hls:-20},mom:"我一个字没说，判决书替我说了",fb:["你不接话茬，律师团三线并进：名誉权、伪造证据、销赃链条。三个月后珊然股价跌去四成，贺兰珊“因病退休”。","你没说一个字。判决书替你全说了——它说得比你狠，也比你有用。你把判决书复印件夹进妈妈手稿的夹页里，合上了。"]},
  {t:"单独约她喝茶：“把三册还我，我给你体面。”",e:{h:1,m:2,f:-1},rel:{hls:-5},mom:"一杯茶，换回妈妈的三册手稿",fb:["茶室里她看着你，忽然笑了：“和你妈当年一样倔。”一周后，三册手稿“匿名”回到你工作室——她认了输，也卖了惨。","有人骂你便宜了她。只有你知道：拿回妈妈的字，比赢一场架重要。你把三册重新摆进展柜，和另外九册并排——十二本，终于齐了。"]}]},
 {a:30,ci:4,bg:"bgStudio",tt:"第 30 关 · 三十岁生日夜",q:"门口的甜甜，你怎么办？",sc:[
  {s:"n",t:"30 岁生日。工作室打通了两层。爸爸把那封“给小满”的信和顶针，一起交到你手上。"},
  {c:"dad",x:"happy",s:"o",t:"你妈说，等你三十岁……再拆。她算得真准啊。"},
  {s:"n",t:"信纸展开，一行字让你瞬间红了眼——「小满，如果你看到这封信，说明你已经走到妈妈没走完的路上了。别怕。妈妈的老师、朋友、学生，都在路上等你。」"},
  {s:"os",t:"原来她一直知道，我会走到这里。"},
  {c:"lj",x:"sad",s:"o",t:"我是你妈妈版房的最后一个助理。那年的事，今晚我全讲给你听。"},
  {c:"lw",x:"sad",s:"o",t:"我是青禾工作室最后的学徒。当年白天骂你，是怕你重蹈她的覆辙。"},
  {c:"gu",x:"sad",s:"o",t:"（拎着酒站在门口，妆都花了）奖学金是我妈捐楼换的定向名额；江屿，是我雇的。我受够了当我姨母的棋子——喏，她和评审往来的录音。拿去。"}],
  fl:[{ifF:"he1",t:"🧵 桂姨拎着一件熨得笔挺的旧工装挤进门：“闺女，我等你来拿，等了十五年。你锁边的手势，我一眼就认出来了——和你妈当年，一模一样。”"},
      {ifF:"he5",t:"🪡 阮奶奶的孙女视频接进来：“奶奶走前说，那个学麦穗锁边的小姑娘是青禾的女儿。她让你——替她把这门手艺，传下去。”"},
      {ifF:"he2",t:"🌷 乔安学姐的鲜花送到了，卡片上写：“天台那晚你说的‘再撑一下’，我撑到了今天。下一站——我跳槽来给你打工。”"}],
  o:[
  {t:"拉她进来：“蛋糕放下，人留下。”",e:{h:3,f:2,m:-1},set:{tian:1},rel:{tian:20,dad:10,gu:20},mom:"三十岁这晚，我把十二年的账都翻了篇",fb:["甜甜哭得睫毛膏都花了：“对不起，当年是我糊涂……”你把果汁塞她手里：“喝完这杯，翻篇。”","满屋的人举杯。妈妈信纸上那句话，在灯光下微微发烫。有些人回来了，有些事，也就过去了。"]},
  {t:"让她把蛋糕放下，先回去",e:{h:1,f:-1,m:1},rel:{tian:-10},fb:["“蛋糕收下了。人……改天吧。”门关上的瞬间，你听见她在楼道里吸鼻子。","有些裂缝补得上；有些，得留给时间慢慢长。你把蛋糕放在桌上，没再看门口一眼。"]},
  {t:"主动走出去，抱她一下",e:{h:2,f:3,he:-1},set:{tian:1},rel:{tian:25},mom:"楼道里的拥抱，胜过一万句对不起",fb:["你光脚跑出去抱住她，两个人在楼道里哭成一团。","这些年她欠你一句对不起，你欠她一句“我也有错”。抱完这一下，谁也没再提当年。不提，就是翻篇了。"]}
]},
 {a:30,ci:4,bg:"bgStudio",tt:"第 31 关 · 大结局 · 吹蜡烛之前",q:"三十岁的第一个决定，是什么？",sc:[
  {s:"n",t:"真相全部归位：十二册手稿重新摆进展柜最中央；贺兰珊的名字成了行业反面教材；爸爸坐在沙发上，第一次喝多了，笑得像个孩子。"},
  {s:"n",t:"蛋糕端上来，三十根蜡烛。所有人安静下来，等你许愿。"},
  {cg:"cg10"},
  {c:"dad",x:"happy",s:"o",t:"许吧。你妈当年也许过一个愿——没来得及实现。"},
  {s:"os",t:"妈妈，你的愿望，是不是就是站上台的那一天？今天——换我来替你吹这口气。可吹完之后，我要成为谁？"}],
  hk:"<b>终幕 · 三十而立</b><br>三十根蜡烛的火光里，你闭上眼睛。十二年的委屈、真相与和解，即将在这一口气里结算——你的人生结局，马上揭晓。",
  o:[
  {t:"重启「青禾」——替妈妈把金奖赢回来",e:{f:2,m:1,h:1,he:-1},set:{brand:"qh"},rel:{dad:15,lj:10,lw:10},mom:"新招牌挂上那天：青禾 2005 · 小满 2026",fb:["招牌挂上那天，老纪和梁薇站在台下，像两个老小孩。发布会大屏上两行字：「青禾，2005。小满，2026。」","妈妈。这一次，我们把名字一起赢回来。只是有时候你会想：如果名字换了，故事还是不是原来的故事？"]},
  {t:"只做「小满」——我的人生不借谁的名字",e:{m:2,h:1,f:-1},set:{brand:"xm"},rel:{dad:10},mom:"青禾是我妈妈，林小满是我",fb:["“青禾是我妈妈，林小满是我。”你对着三十根蜡烛说。掌声很响，你很平静。","上一个十二年，证明给别人看；下一个十二年——证明给自己看。这条路更安静，也更贵。"]},
  {t:"双线「青禾·小满」——传承她的名，活成我自己",e:{h:2,f:1,m:1,he:-1},set:{brand:"qx"},rel:{dad:20,lj:5,lw:5},mom:"青禾是来路，小满是去处",fb:["发布会那天，你穿着妈妈旧款的改良礼服上台，谢幕时举起那枚顶针：“青禾是来路，小满是去处。”","台下一片灯海。妈妈——我们到家了。可“到家”这两个字，有时候比出发更重。"]}]}
]},

  {s:"n",t:"社团晚会前夜，演出服的袖口被缝纫机咬穿了个洞。你抱着衣服敲开楼下裁缝铺的灯。"},
  {c:"gy",x:"happy",s:"o",t:"（接过衣服，忽然停住）这针脚……小姑娘，让我想起一个老朋友。不收钱，走吧，下次袖口别自己瞎锁。"},
  {s:"os",t:"十五年后你才知道，这盏深夜亮着的灯，为你亮了一辈子。有些人，在你还不知道自己是谁的时候，就已经认出来了。"}]},
 {id:"he2",em:"🌉",name:"天台上的学姐",min:19,max:23,after:6,cond:function(S){return S.st.h<=11;},bg:"bgRooftop",rel:{qa:20},e:{h:1,f:2},sc:[
  {s:"n",t:"期末周，教学楼天台有个学姐在哭。家里出事，她想退学去打工。"},
  {c:"man",x:"norm",s:"m",t:"再撑一下。撑不住的时候，就先只撑今天一天。"},
  {s:"n",t:"三年后，上岸大厂的乔安学姐把内推码拍在你面前：“那天你说的话，我记到今天。”"},
  {s:"os",t:"你把内推码存进手机。有些话很轻，落地却很沉——沉到能托住另一个人的三年。"}]},
 {id:"he3",em:"🍢",name:"深夜便利店的许主编",min:22,max:26,after:12,cond:function(S){return S.st.f>=9;},bg:"bgShop",rel:{xu:15},e:{m:-1,f:2},sc:[

  e5:function(l){var bi=0,best=-1e9;l.o.forEach(function(o,i){var s=(o.e.m||0);if(i===0||s>best){best=s;bi=i;}});return bi;},
  e6:function(l){var bi=0,best=-1e9;l.o.forEach(function(o,i){var s=(o.e.f||0);if(i===0||s>best){best=s;bi=i;}});return bi;},
  e7:function(l){var bi=0,best=-1e9;l.o.forEach(function(o,i){var s=(o.e.h||0);if(i===0||s>best){best=s;bi=i;}});return bi;},
  e8:function(l){var bi=0,best=1e9;l.o.forEach(function(o,i){var rs=0;if(o.rel)for(var k in o.rel)rs+=o.rel[k];var s=Math.abs(o.e.m||0)+Math.abs(o.e.h||0)+Math.abs(o.e.he||0)+Math.abs(o.e.f||0)+Math.abs(rs)/2;if(i===0||s<best){best=s;bi=i;}});return bi;},
  e9:function(l){var bi=0,best=-1e9;l.o.forEach(function(o,i){var rs=0;if(o.rel)for(var k in o.rel)rs+=o.rel[k];var s=(o.e.m||0)*2-rs;if(i===0||s>best){best=s;bi=i;}});return bi;}
 };
 function drainNow(){var g=0;while(cur&&(cur.phase==='dlg'||cur.phase==='cg')&&g++<60)tapScene();if(cur&&cur.phase==='fb')goNext();}
 function play(id){
  initState();var guard=0;
  while(S.li<LEVELS.length&&guard++<400){
   if(!cur){showLevel();continue;}
   drainNow();
   if(!cur||cur.phase!=='choice')continue;
   var l=LEVELS[S.li];var idx=strat[id](l);
   pick(Math.min(idx,cur.opts.length-1));afterFb();
  }
  return calcEnd().id;
 }
 var out={deterministic:{},random:{},issues:[]};
 ENDINGS.forEach(function(e){
  var id=e.id;initState();var guard=0;var got=null;
  while(S.li<LEVELS.length&&guard++<400){
   if(!cur){showLevel();continue;}
   drainNow();
   if(!cur||cur.phase!=='choice')continue;
   var l=LEVELS[S.li];var idx=strat[id](l);
   pick(Math.min(idx,cur.opts.length-1));afterFb();
  }
  got=calcEnd().id;
  out.deterministic[id]=got;
  if(got!==id)out.issues.push("确定性路径 "+id+" 实得 "+got);
 });
 initState();
 var dist={};
 for(var i=0;i<runs;i++){
  initState();var guard=0;
  while(S.li<LEVELS.length&&guard++<400){
   if(!cur){showLevel();continue;}
   drainNow();
   if(!cur||cur.phase!=='choice')continue;
   pick(Math.floor(Math.random()*cur.opts.length));afterFb();
  }
  var id=calcEnd().id;dist[id]=(dist[id]||0)+1;
 }
 out.random=dist;
 ENDINGS.forEach(function(e){
  var id=e.id;var pct=(dist[id]||0)/runs*100;
  if(id!=='e8'&&pct<2)out.issues.push("随机占比 "+id+"="+pct.toFixed(1)+"% <2%");
 });
 out.hiddenNote="5 个隐藏事件为条件触发（HIDDEN[].cond），确定性集齐路径见变更说明";
 console.log("%c__selfTest","color:#ffd982;font-weight:bold",out);
 return out;
};

/* ================= 音乐 + 音效系统（真 mp3；缺文件时明确提示，不用合成音顶替；短音效保留） ================= */
const BGM_FILES={man:"xiaoman",lw:"liangwei",tian:"tiantian",hls:"helanshan"};
const bgmPool={};let bgmCur=null,bgmOn=false,unlocked=false,bgmWant="general",missToastShown=false;
let AC=null,sfxGain=null;
/* ---- 设置 ---- */
let settings={font:16,speed:16,vol:0.42};
function loadSettings(){try{const d=JSON.parse(localStorage.getItem("rsmn_settings"));if(d){if(d.font===14||d.font===16||d.font===18)settings.font=d.font;if(d.speed===40||d.speed===16||d.speed===6)settings.speed=d.speed;if(d.vol===0||d.vol===0.2||d.vol===0.42)settings.vol=d.vol;}}catch(e){}}
function saveSettings(){try{localStorage.setItem("rsmn_settings",JSON.stringify(settings));}catch(e){}}
function curVol(){return bgmOn?settings.vol:0;}
function ac(){
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
 if(AC){
  if(AC.state==="suspended"){try{AC.resume();}catch(e){}}
  if(!sfxGain){sfxGain=AC.createGain();sfxGain.connect(AC.destination);}
  sfxGain.gain.value=settings.sfxOn&&settings.vol>0?0.21:0;
 }
 return AC;
}
function applyVolumes(){
 if(sfxGain)sfxGain.gain.value=settings.sfxOn&&settings.vol>0?0.21:0;
 const a=bgmCur?getBgm(bgmCur):null;if(a&&!a._ft){try{a.volume=curVol();}catch(e){}}
}
function missToast(){if(!missToastShown){toast("音乐文件缺失，请检查 assets/bgm/");missToastShown=true;}}

function applyFont(){document.documentElement.style.setProperty("--dlgfont",settings.font+"px");}
function v3(v,l){var b=document.createElement("button");b.className="setb"+(settings.sfxOn===v?" on":"");b.textContent=l;b.onclick=function(){setSfx(v)};return b.outerHTML;}
function v4(v,l){var b=document.createElement("button");b.className="setb"+(settings.hints===v?" on":"");b.textContent=l;b.onclick=function(){setHints(v)};return b.outerHTML;}
function setSfx(v){settings.sfxOn=v;saveSettings();applyVolumes();toast(v?"音效已开启":"音效已关闭");}
function setHints(v){settings.hints=v;saveSettings();toast(v?"将显示具体后果":"将只显示倾向");if(cur&&cur.phase==="choice")buildChoices();}
/* ---- 文件音乐 ---- */
function getBgm(id){
 if(bgmPool[id]!==undefined)return bgmPool[id];
 try{const a=new Audio("assets/bgm/"+id+".mp3");a.loop=true;a.preload="auto";a.volume=0;
  a.addEventListener("error",()=>{bgmPool[id]=null;if(bgmCur===id&&unlocked&&bgmOn)missToast();});
  bgmPool[id]=a;}
 catch(e){bgmPool[id]=null;}
 return bgmPool[id];
}
["general"].concat(Object.keys(BGM_FILES).map(k=>BGM_FILES[k])).forEach(getBgm);
function fadeTo(a,vol,ms){
 if(!a)return;const from=a.volume,steps=Math.max(1,Math.round(ms/50));
 if(a._ft)clearInterval(a._ft);let i=0;
 a._ft=setInterval(()=>{i++;a.volume=Math.max(0,Math.min(1,from+(vol-from)*i/steps));if(i>=steps){clearInterval(a._ft);a._ft=null;if(vol===0){try{a.pause();}catch(e){}}}},50);
}
/* ---- 播放调度 ---- */
function playMusic(name){
 const a=getBgm(name);
 if(a){try{if(!a.paused){fadeTo(a,curVol(),900);}else{a.volume=0;a.play().then(()=>{fadeTo(a,curVol(),900);}).catch(()=>{missToast();});}}catch(e){missToast();}}
 else missToast();
}
function speakTheme(cid){
 const name=cid&&BGM_FILES[cid]?BGM_FILES[cid]:"general";
 if(!unlocked){bgmWant=name;return;}
 if(bgmCur===name)return;
 const oldFile=bgmCur?getBgm(bgmCur):null;
 if(oldFile)fadeTo(oldFile,0,700);
 bgmCur=name;
 if(!bgmOn||curVol()===0)return;
 playMusic(name);
}
function ensureAudio(){
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
 if(AC&&AC.state==="suspended"){try{AC.resume();}catch(e){}}
 if(AC&&sfxGain)sfxGain.gain.value=settings.sfxOn&&settings.vol>0?0.21:0;
 return AC;
}
document.addEventListener("pointerdown",function once(e){if(e&&e.target&&e.target.id==="sndBtn")return;ensureAudio();document.removeEventListener("pointerdown",once);},{once:false});
function toggleSound(ev){
 if(ev){ev.stopPropagation();if(ev.preventDefault)ev.preventDefault();}
 ensureAudio();
 if(!bgmStarted){
  bgmStarted=true;bgmOn=true;$("sndBtn").textContent="🔊";applyVolumes();
  playMusic(bgmCur||bgmWant||"general");
  toast(getBgm(bgmCur||"general")?"音乐已开启 🎵":"音乐文件缺失，请检查 assets/bgm/");
  return;
 }
 bgmOn=!bgmOn;
 $("sndBtn").textContent=bgmOn?"🔊":"🔈";
 applyVolumes();
 if(bgmOn){playMusic(bgmCur||bgmWant||"general");toast("音乐已开启 🎵");}
 else{const a=bgmCur?getBgm(bgmCur):null;if(a)fadeTo(a,0,300);toast("音乐已关闭");}
}
function sfx(kind){
 if(!settings.sfxOn||settings.vol===0)return;const c=ensureAudio();if(!c||!sfxGain)return;
 try{
  const beep=(f,T,d,g,type)=>{const o=c.createOscillator(),gn=c.createGain();o.type=type||"sine";o.frequency.value=f;gn.gain.setValueAtTime(0,T);gn.gain.linearRampToValueAtTime(g,T+0.01);gn.gain.linearRampToValueAtTime(0,T+d);o.connect(gn);gn.connect(sfxGain);o.start(T);o.stop(T+d+0.02);};
  const slide=(f1,f2)=>{const T=c.currentTime,o=c.createOscillator(),gn=c.createGain();o.type="sine";o.frequency.setValueAtTime(f1,T);o.frequency.linearRampToValueAtTime(f2,T+0.18);gn.gain.setValueAtTime(0,T);gn.gain.linearRampToValueAtTime(0.07,T+0.02);gn.gain.linearRampToValueAtTime(0,T+0.2);o.connect(gn);gn.connect(sfxGain);o.start(T);o.stop(T+0.25);};
  if(kind==="blip")beep(880,c.currentTime,0.05,0.06,"sine");
  else if(kind==="confirm"){beep(523.25,c.currentTime,0.07,0.07,"sine");beep(783.99,c.currentTime+0.07,0.1,0.07,"sine");}
  else if(kind==="up")slide(440,880);
  else if(kind==="dn")slide(660,330);
 }catch(e){}
}

/* ================= V4 系统（第 5-12 项）：面板 / 存档 / 设置 / 回看 / 自动 / CG 鉴赏 ================= */
function stopEv(e){if(e){e.stopPropagation();if(e.preventDefault)e.preventDefault();}}
function openPanel(html){const p=$("panel");$("panelBody").innerHTML=html;p.style.display="flex";}
function closePanel(){const p=$("panel");if(p)p.style.display="none";}
/* ---- 存档（第 6 项） ---- */
function captureState(){return{st:{...S.st},li:S.li,fl:{...S.fl},hidden:[...S.hidden],moms:[...S.moms],rel:{...S.rel},dry:S.dry,time:Date.now()};}
function saveTo(slot){try{localStorage.setItem("rsmn_save_"+slot,JSON.stringify(captureState()));return true;}catch(e){return false;}}
function peekSave(slot){
 try{const raw=localStorage.getItem("rsmn_save_"+slot);
  if(raw===null)return{empty:true};
  try{const d=JSON.parse(raw);if(!d||typeof d.li!=="number"||!d.st)return{bad:true};return{d:d};}catch(e){return{bad:true};}
 }catch(e){return{bad:true};}
}
function fmtTime(t){try{const d=new Date(t);return d.getFullYear()+"."+(d.getMonth()+1)+"."+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}catch(e){return"—";}}
function openSavePanel(){
 let html=`<div class="ptitle">💾 存档</div>`;
 [["auto","自动存档"],["1","存档一"],["2","存档二"],["3","存档三"]].forEach(pair=>{
  const slot=pair[0],label=pair[1],p=peekSave(slot);let info="空存档",canLoad=false;
  if(p.bad)info="存档损坏";
  else if(p.d){const li2=Math.min(p.d.li,LEVELS.length-1),lv=LEVELS[li2],ch=DATA[lv.ci];
   info=`第${ch.no}章 · ${ch.name}<br>${lv.tt} · ${fmtTime(p.d.time)}<br>💰${p.d.st.m} 😊${p.d.st.h} 💪${p.d.st.he} 👥${p.d.st.f}`;canLoad=true;}
  html+=`<div class="scard"><div class="scl">${label}</div><div class="sci">${info}</div><div class="scb">${slot!=="auto"?`<button class="sbtn" onclick="doSave('${slot}')">存档</button>`:""}${canLoad?`<button class="sbtn" onclick="doLoad('${slot}')">读档</button>`:""}${(canLoad||p.bad)?`<button class="sbtn warn" onclick="doDel('${slot}')">删除</button>`:""}</div></div>`;
 });
 html+=`<button class="primary" onclick="closePanel()">关闭</button>`;
 openPanel(html);
}
function chStartKey(ci){return "rsmn_chstart_"+ci;}
function openChapters(){
 var reached={};try{reached=JSON.parse(localStorage.getItem("rsmn_reached")||"{}");}catch(e){}
 var html=DATA.map(function(ch,ci){
  var ok=ci===0||!!reached["c"+ci];
  var cls=ok?"chbtn":"chbtn lock";
  var dis=ok?"":" disabled";
  return "<button class="+cls+dis+" onclick=\"gotoChapter("+ci+")\">"+ch.em+" 第"+ch.no+"章"+ch.name+" <span>"+ch.ages+(ok?"":" \ud83d\udc12")+"</span></button>";
 }).join("");
 openPanel(html+"<button class=\"primary\" onclick=\"closePanel()\">关闭</button>");
}
function gotoChapter(ci){
 var d=null;try{d=JSON.parse(localStorage.getItem(chStartKey(ci)));}catch(e){}
 initState();
 if(d&&d.st){S.st=d.st;S.fl=d.fl||{};S.hidden=d.hidden||[];S.moms=d.moms||[];S.rel=d.rel||{};S.dry=d.dry||0;}
 S.li=LEVELS.length-1;
 for(var i=0;i<LEVELS.length;i++){if(LEVELS[i].ci===ci){S.li=i;break;}}
 cur=null;chLog=[];chLogCi=-1;closePanel();renderBars();
 if(S.li>=LEVELS.length){showEnd();return;}
 showLevel();
}
function unlockCG(id){try{var l=JSON.parse(localStorage.getItem("rsmn_cg")||"[]");if(!l.includes(id)){l.push(id);localStorage.setItem("rsmn_cg",JSON.stringify(l));}}catch(e){}}
function cgList(){try{var l=JSON.parse(localStorage.getItem("rsmn_cg")||"[]");return Array.isArray(l)?l:[];}catch(e){return[];}}
function openGallery(){
 var un=cgList();
 var cells=Object.keys(CGS).map(function(id){
  if(un.includes(id))return "<button class='gcell' onclick='viewCG(\""+id+"\")'><span class='gthumb "+CGS[id].bg+"'>\u2728</span><span class='gname'>"+CGS[id].title+"</span></button>";
  return "<div class='gcell lock'><span class='gthumb glocked'>\ud83d\udc12</span><span class='gname'>未解锁</span></div>";
 }).join("");
 openPanel("<div class='ptitle'>🖼️ CG 鉴赏（"+un.length+"/"+Object.keys(CGS).length+"）</div><div class='ggrid'>"+cells+"</div><button class=\"primary\" onclick=\"closePanel()\">关闭</button>");
}
function viewCG(id){
 var g=CGS[id];
 openPanel("<div class='ptitle'>"+g.title+"</div><div class='cgview'>"+cgHTML(id)+"</div><button class=\"primary\" onclick=\"closePanel()\">关闭</button>");
}
function doSave(slot){
 const p=peekSave(slot);
 if(p.d&&!confirm("该存档位已有进度，确定覆盖吗？"))return;
 if(saveTo(slot)){toast("已存档 ✓");openSavePanel();}
 else toast("存档失败（存储不可用）");
}
function doLoad(slot){
 const p=peekSave(slot);if(!p.d)return;
 if((S.li>0||S.dry>0||S.moms.length)&&!confirm("读档将覆盖当前进度，确定吗？"))return;
 applySave(p.d);toast("已读档 ✓");
}
function doDel(slot){if(!confirm("确定删除这个存档吗？"))return;try{localStorage.removeItem("rsmn_save_"+slot);}catch(e){}openSavePanel();}
function applySave(d){
 initState();S.st={...d.st};S.li=Math.min(Math.max(0,d.li),LEVELS.length-1);S.fl=d.fl||{};S.hidden=d.hidden||[];S.moms=d.moms||[];S.rel=d.rel||{};S.dry=d.dry||0;
 cur=null;closePanel();renderBars();showLevel();
 window.scrollTo({top:0,behavior:"smooth"});
}
function hasAnySave(){for(const s of["auto","1","2","3"]){const p=peekSave(s);if(p.d)return true;}return false;}
function latestSave(){let best=null;for(const s of["auto","1","2","3"]){const p=peekSave(s);if(p.d&&(!best||p.d.time>best.d.time))best=p;}return best;}
function continueGame(){const b=latestSave();if(!b){toast("还没有存档，先开始一段人生吧");return;}applySave(b.d);}
/* ---- 章节选择（第 5 项） ---- */
function markReached(ci){
 ci=Math.max(0,Math.min(ci,DATA.length-1));
 try{const r=JSON.parse(localStorage.getItem("rsmn_reached")||"{}");r["c"+ci]=1;localStorage.setItem("rsmn_reached",JSON.stringify(r));}catch(e){}
}
function markRead(key){
 try{const k=key||(S.li+"-"+cur.idx);const m=readMap();if(!m[k]){m[k]=1;localStorage.setItem("rsmn_read",JSON.stringify(m));}}catch(e){}
}
function isRead(k){return !!readMap()[k];}
function skipRead(){
 if(!cur||cur.phase!=="dlg")return;
 if(!confirm("将跳过已读内容，遇到未读内容或选项会停下"))return;
 const snap=readMap();
 let g=0;
 while(cur&&cur.phase==="dlg"&&g++<400){
  if(!snap[S.li+"-"+cur.idx]){if(cur.typing)finishType();toast("已停在未读内容");return;}
  if(cur.typing)finishType();
  cur.idx++;
  if(cur.idx>=cur.lv.sc.length){endDlg();return;}
  renderLine();
  if(cur.typing)finishType();
 }
}
function openLog(){
 if(!cur)return;
 const rows=chLog.map(x=>`<div class="lrow"><b>${x.n}</b><p>${x.t}</p></div>`).join("");
 openPanel(`<div class="ptitle">📜 对话记录（本关）</div><div class="lscroll">${rows||"<p style='color:#999;text-align:center;margin:8px 0'>还没有台词</p>"}</div><button class="primary" onclick="closePanel()">关闭</button>`);
 const sc=document.querySelector(".lscroll");if(sc)sc.scrollTop=sc.scrollHeight;
}

document.addEventListener("keydown",function(e){
 if(e.repeat)return;
 var k=e.key;
 if(k==="Escape"){closePanel();return;}
 var tag=(e.target&&e.target.tagName)||"";
 if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
 if(cur&&cur.phase==="dlg"&&(k===" "||k==="Enter")){e.preventDefault();tapScene();return;}
 if(cur&&cur.phase==="cg"&&(k===" "||k==="Enter")){e.preventDefault();tapScene();return;}
 if(cur&&cur.phase==="choice"&&(k==="1"||k==="2"||k==="3"||k==="4")){var i=+k-1;if(cur.opts&&cur.opts[i]){e.preventDefault();pick(i);}}
});
loadSettings();applyFont();
initState();showStart();
</script>
