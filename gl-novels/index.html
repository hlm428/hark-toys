      :root {

      .x-clear {

      .x-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; }

      }

      .x-chip {
        flex: none; display: inline-flex; align-items: center; gap: 6px;
        min-height: var(--tap); padding: 0 14px;
        border-radius: var(--r-pill);
        border: 1px solid var(--stroke-primary);
        background: var(--fill-primary-on); color: var(--text-primary);
        font: var(--type-label); white-space: nowrap; cursor: pointer;
        scroll-snap-align: start;
        transition: background var(--dur-quick) ease, border-color var(--dur-quick) ease;
      }
      .x-chip b {
        min-width: 20px; padding: 1px 6px; border-radius: var(--r-pill);
        background: var(--fill-tertiary); color: var(--text-secondary);
        font: var(--type-tag); text-align: center;
      }
      .x-chip[aria-pressed="true"] { background: var(--x-lilac-soft); border-color: var(--x-lilac); }
      .x-chip[aria-pressed="true"] b { background: var(--x-lilac); color: var(--fill-primary-on); }
      .x-chip:disabled { opacity: 0.5; cursor: default; }
      .x-random {
        display: inline-flex; align-items: center; gap: 8px;
        min-height: var(--tap); padding: 0 16px;
        border-radius: var(--r-pill); border: 0;
        background: var(--x-blush-soft); color: var(--text-primary);
        font: var(--type-label); cursor: pointer;
      }
      .x-random:hover { box-shadow: inset 0 0 0 100px var(--hover-wash); }
      .x-count { font: var(--type-small); color: var(--text-secondary); }
      .x-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
      @media (min-width: 900px) { .x-list { grid-template-columns: 1fr 1fr; } }

      @media (prefers-reduced-motion: reduce) { .x-book.is-picked { animation: none; } }
      .x-book h3 { font: var(--type-body-strong); font-weight: var(--weight-bold); font-size: var(--size-prose); }

      @media (max-width: 599px) {

    <script>

        娱乐圈: [
          { title: "放肆[娱乐圈]", author: "玄笺", status: "完结", tag: "近代现代-爱情", desc: "年仅22岁的唐若遥摘下影后桂冠，前途光明。隔天媒体铺天盖地发通稿，盛誉其为“小秦意浓”。唐若遥粉丝怒不……", url: J + "4032130" },
          { title: "影后有堵墙（GL）", author: "云惘然", status: "完结", tag: "近代现代-爱情", desc: "两届金星球奖影后于念冰结束拍摄回家，凳子没坐热，瓜刚吃两口，卧室的墙就被砸穿了……隔壁是半年前为了蹭热搜与自己假表白的……", url: J + "3975220" },
          { title: "疯美人的重生 [娱乐圈]", author: "叶以秋", status: "完结", tag: "近代现代-爱情", desc: "豪华公寓的浴缸内惊现一具年轻女尸，是当红女星乔苒若。她生前是个为戏而生的戏疯子，又美又疯，却风评极差，死后更是身败名裂，众叛亲离。", url: J + "4513642" },
          { title: "你不是笔直笔直的天后吗？", author: "一跳跳到山外山", status: "连载", tag: "近代现代-爱情", desc: "青年舞蹈家 & 影音双栖天后。破圈，跨界，一切由一场真人秀开始……细水长流，8岁年龄差。", url: J + "2566796" },
          { title: "上娃综后，影后渣A洗白了", author: "张修竹", status: "完结", tag: "近代现代-爱情", desc: "每一个霸道总裁狗血文（GL）里都有一个小白花柔弱女主，在等来正主之前，还有一个负心薄幸的前女友反派渣A。", url: J + "6963936" },
          { title: "百老汇再无佳人", author: "墨兰疏影", status: "完结", tag: "近代现代-爱情", desc: "每只白天鹅心中都住着一只黑天鹅，好莱坞史上最特立独行的影后阿德莱德也未能免俗。“偏爱月色动人，怎奈夜色弄人。”", url: J + "5122676" },
        ],
        都市甜宠: [
          { title: "我老婆，反派大佬，超可爱", author: "穹灰", status: "完结", tag: "近代现代-爱情", desc: "古早火葬场小说里，经常有这样一群反派大佬：偏执、疯批、病娇，占有欲超强，常因一些常人难以理解的理由，疯狂地爱上女主角……", url: J + "7632356" },
          { title: "首富千金的金丝雀", author: "怀昭", status: "完结", tag: "近代现代-爱情", desc: "怀昭的都市甜文，故事简介请到晋江原文页查看。", url: J + "6125457" },
          { title: "金牌律师Alpha和她的江医生", author: "青云岫", status: "完结", tag: "近代现代-爱情", desc: "ABO题材，双御姐：金牌律师Alpha与江医生。", url: J + "4503004" },
          { title: "屠队长和她的沈医生", author: "青云岫", status: "完结", tag: "近代现代-爱情", desc: "屠队长与沈医生的故事，简介请到晋江原文页查看。", url: J + "2565377" },
          { title: "今天仍不知老婆是首富", author: "叶无枝", status: "完结", tag: "近代现代-爱情", desc: "沈知言被母亲安排去相亲。听说对方是秦家的女儿，长得漂亮，活泼可爱，还……", url: J + "5045581" },
          { title: "非典型离婚", author: "白渡鸦", status: "完结", tag: "近代现代-爱情", desc: "一篇A强O更强的离婚火葬场，自设ABO仅有信息素，离婚事出有因，A没渣过。前期慢热，现实与回忆交叉。", url: J + "9690619" },
          { title: "大小姐想让我从良", author: "冬日解剖", status: "完结", tag: "近代现代-爱情", desc: "初见姜颜林，她是好友暗恋的女人；再见，她是好友追求的女人；三见，裴挽意想：朋友什么的，不要也行。", url: J + "5271247" },
          { title: "白云行空于浅阳", author: "稳重王", status: "完结", tag: "近代现代-爱情", desc: "这是间谍和演员的故事。“我以为你会选蓝色。”钟浅晴戴上头盔，熟练地跨过自行车车座……", url: J + "8461186" },

          { title: "糖柠之恋", author: "夏恋樱火", status: "完结", tag: "近代现代-爱情", desc: "同爱人相守时的幸福，如梦似幻，却又无比真实；昨日的悲欢离合，像过往云烟，但从不曾被亲历者忘怀。", url: J + "4890379" },
          { title: "贵族学院恋爱模拟器", author: "晓梦致幻生", status: "完结", tag: "近代现代-爱情", desc: "为了探索所有剧情她不停回档，NPC却一不小心就黑化：豪门大小姐要对她强制爱，特优生学霸转眼变成跟踪狂……", url: J + "7699889" },
          { title: "青梅", author: "月令辰", status: "完结", tag: "古色古香-爱情", desc: "“郎骑竹马来，绕床弄青梅。”齐映州齐官人有一妹妹，年方二八，姓陆，名青蕤，待字闺中。", url: J + "4534207" },
        ],
        古风宫廷: [
          { title: "凰涅天下(GL)", author: "君朝西", status: "完结", tag: "古色古香-传奇", desc: "卫希颜在一次血战中跌落到千年前的北宋。她一心寻求归家之路，孰料重生身世隐着重重秘密，被迫踏入江湖，从江湖到朝局……", url: J + "340107" },
          { title: "兰陵风流", author: "君朝西", status: "完结", tag: "架空历史-剧情", desc: "一个强盛、风流、大势之下共争锋的时代。她是萧氏之子，身世却错综复杂，在这个帝国中一步步……", url: J + "2161744" },
          { title: "养丞", author: "宁远", status: "完结", tag: "古色古香-传奇", desc: "童少悬第一次见到家道中落的唐三娘唐见微，是在长公主的赏春雅聚上，见识了她的绝世容貌，更见识了她巧舌如簧、表里不一。", url: J + "3955358" },
          { title: "江山和我，女皇都要", author: "怀昭", status: "完结", tag: "架空历史-爱情", desc: "高冷傲娇女皇O × 温柔宠溺天才A。上位者为爱低头，双强女主、双高智商、精彩权谋。", url: J + "6249937" },
          { title: "山川月", author: "苏弦_", status: "完结", tag: "古色古香-剧情", desc: "恶人或英雄，权柄或信义，抉择皆在一念间。温明裳入京初识洛清河时，对方是同僚口中善恶莫辨的少年将军。", url: J + "5267535" },
          { title: "银锁金铃记gl", author: "黄连苦寒", status: "完结", tag: "古色古香-爱情", desc: "神仙谷主破星老人多年前觅得良徒二人，均是天纵英才。数年之后，见解分歧的两人愤然离谷……", url: J + "1890105" },
          { title: "郡马是个药罐子", author: "鲨鱼傻不傻", status: "完结", tag: "古色古香-爱情", desc: "听说威远将军家的小公子、未来的郡马爷是个药罐子，文不成武不就还有隐疾。林思慎听着外头的传闻，心里乐开了花。", url: J + "2730512" },
          { title: "女首辅宠妻日常", author: "岁岁明美", status: "完结", tag: "架空历史-爱情", desc: "沈砚清重生回十四岁，仍是寒门里被全家寄予厚望的“读书苗子”。上一世她权倾朝野，却满门抄斩……", url: J + "9272354" },
          { title: "鲤跃龙门", author: "融泥", status: "完结", tag: "架空历史-爱情", desc: "皇太女朝不保夕的登极之路 vs 女状元一言难尽的复仇之路。皇帝临死时立她为皇太女，后来却奇迹康复……", url: J + "3384932" },
        ],
        仙侠修真: [
          { title: "昆仑卿", author: "火柴乌鸦", status: "完结", tag: "架空历史-仙侠", desc: "谢挚起于大荒，十六岁名动中州，来到歧都受封。紫宸殿上仙光灿灿，人皇自王座上微笑，先许仙材地宝，谢挚不应……", url: J + "6950608" },
          { title: "执子之手gl[修真]", author: "御风流", status: "完结", tag: "架空历史-仙侠", desc: "孟随云初见楚摘星时，她还是众人眼中的小傻子。孟随云手把手带她走上修仙之路，听这个奶团子软糯糯喊师姐，有求必应。", url: J + "4354338" },
          { title: "执剑抱走师姐(穿书）", author: "河沐", status: "完结", tag: "架空历史-爱情", desc: "伏颜穿进了一本男频修仙后宫文，男主一边修仙成神一边收获后宫。虽然被原剧情雷得外焦里嫩……", url: J + "4390703" },
          { title: "清冷龙女她总想杀我", author: "长猫帽子", status: "完结", tag: "架空历史-爱情", desc: "貌美青蛇 × 冰山龙女，偏剧情，HE。", url: J + "5892034" },
          { title: "与师为妻", author: "燎汐", status: "完结", tag: "架空历史-仙侠", desc: "鹤卿，修为低下、资质平平，离尧山上默默无名的外门弟子；月泽，天资……", url: J + "6999934" },
          { title: "传闻中的999级反派仙尊gl", author: "万言不值一块钱", status: "完结", tag: "架空历史-仙侠", desc: "兢兢业业跟随事业统的无晴仙尊璃月白终于迎来飞升，却因男主的“肾见钟情”飞升失败。", url: J + "4040288" },

      const ALL = [];
      Object.entries(BOOKS).forEach(([cat, list]) => list.forEach((b) => ALL.push({ ...b, cat, id: ALL.length })));
      const CATS = Object.keys(BOOKS);
      const state = { q: "", status: "全部", cat: "全部" };
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

      function matchBase(b) {
        if (state.status !== "全部" && b.status !== state.status) return false;
        if (!state.q) return true;
        const q = state.q.toLowerCase();
        return (b.title + " " + b.author + " " + b.desc).toLowerCase().includes(q);
      }
      const current = () => ALL.filter((b) => matchBase(b) && (state.cat === "全部" || b.cat === state.cat));

      function chip(label, count, pressed, key) {
        return `<button class="x-chip" type="button" data-key="${esc(key)}" aria-pressed="${pressed}"${count === 0 && !pressed ? " disabled" : ""}>${esc(label)}${count == null ? "" : ` <b>${count}</b>`}</button>`;
      }

      function render() {
        $("status").innerHTML = ["全部", "完结", "连载"].map((s) => chip(s, null, state.status === s, s)).join("");
        const base = ALL.filter(matchBase);
        $("cats").innerHTML =
          chip("全部", base.length, state.cat === "全部", "全部") +
          CATS.map((c) => chip(c, base.filter((b) => b.cat === c).length, state.cat === c, c)).join("");

        const list = current();
        $("count").textContent = list.length ? `共 ${list.length} 本` : "";
        $("random").disabled = !list.length;
        if (!list.length) {
          $("list").innerHTML = `<li class="x-empty">没有找到符合条件的书，换个关键词试试？<br /><button class="btn" type="button" id="reset">清除筛选</button></li>`;
          $("reset").onclick = () => { state.q = ""; state.status = "全部"; state.cat = "全部"; $("q").value = ""; $("clear").hidden = true; render(); };
          return;
        }
        $("list").innerHTML = list
          .map(
            (b) => `<li><a class="x-book" id="b${b.id}" href="${esc(b.url)}" target="_blank" rel="noopener" aria-label="${esc(b.title)}，${esc(b.author)}，${b.status}，去晋江看">
  <div>
    <h3>${esc(b.title)}</h3>
    <p class="x-meta"><span>${esc(b.author)}</span><span class="x-status${b.status === "连载" ? " x-status--on" : ""}">${b.status}</span><span class="pill">${esc(b.tag)}</span></p>
    <p class="x-blurb">${esc(b.desc)}</p>
  </div>
  <span class="x-go" aria-hidden="true">去看 →</span>
</a></li>`
          )
          .join("");
      }

      $("q").addEventListener("input", (e) => { state.q = e.target.value.trim(); $("clear").hidden = !e.target.value; render(); });
      $("clear").addEventListener("click", () => { $("q").value = ""; state.q = ""; $("clear").hidden = true; render(); $("q").focus(); });
      $("status").addEventListener("click", (e) => { const t = e.target.closest(".x-chip"); if (!t) return; state.status = t.dataset.key; render(); });
      $("cats").addEventListener("click", (e) => {
        const t = e.target.closest(".x-chip"); if (!t || t.disabled) return;
        state.cat = t.dataset.key; render();
        const now = $("cats").querySelector('[aria-pressed="true"]');
        if (now) now.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
      });
      $("random").addEventListener("click", () => {
        const list = current(); if (!list.length) return;
        const pick = list[Math.floor(Math.random() * list.length)];
        document.querySelectorAll(".x-book.is-picked").forEach((el) => el.classList.remove("is-picked"));
        const el = $("b" + pick.id); if (!el) return;
        void el.offsetWidth;
        el.classList.add("is-picked");
        el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
        el.focus({ preventScroll: true });
        clearTimeout(window.__pickT);
        window.__pickT = setTimeout(() => el.classList.remove("is-picked"), 4000);
      });
      render();
    </script>
