name: yt-audio
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -U yt-dlp
          sudo apt-get install -y ffmpeg >/dev/null
          mkdir -p audio
          for c in android_vr tv_simply web_embedded mweb ios default; do yt-dlp --extractor-args "youtube:player_client=$c" -x --audio-format mp3 --audio-quality 2 -o "audio/%(id)s.%(ext)s" "${{ github.event.inputs.url }}" && break; done; ls audio/*.mp3
          git config user.name bot; git config user.email bot@x
          git add audio; git commit -m audio; git push
