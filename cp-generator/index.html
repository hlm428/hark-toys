    />

    <style>
      :root {
        --x-pink: #f6dde4;
        --x-lilac: #e6e0f3;
        --x-cream: #fdf7f1;
        --x-ink: #6b4a57;
        --x-line: #efdce3;
      }
      body {
        background: linear-gradient(170deg, var(--x-cream), #f8eef3 55%, #efe9f7);
      }
      .x-chipset {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .x-chip {
        min-height: var(--tap);
        padding: 6px 14px;
        border-radius: var(--r-pill);
        border: 1px solid var(--x-line);
        background: #fff;
        color: var(--x-ink);
        font: var(--type-tag);
        cursor: pointer;
      }
      .x-chip[aria-pressed="true"] {
        background: var(--x-pink);
        border-color: #e8c3cf;
        font-weight: var(--weight-medium);
      }
      .x-go {
        min-height: var(--tap);
        padding: 10px 26px;
        border: 0;
        border-radius: var(--r-pill);
        background: linear-gradient(120deg, #f3c6d4, #ded3f0);
        color: var(--x-ink);
        font: var(--type-label);
        font-weight: var(--weight-bold);
        cursor: pointer;
      }
      .x-duo {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        transition: opacity var(--dur-quick) var(--ease-out);
      }
      #cpBox {
        transition: opacity var(--dur-quick) var(--ease-out);
      }
      .x-duo.is-out,
      #cpBox.is-out {
        opacity: 0;
      }
      .x-card {
        padding: 18px 20px;
        border-radius: var(--r-l);
        border: 1px solid var(--x-line);
        background: rgba(255, 255, 255, 0.72);
        transition: opacity var(--dur-quick) var(--ease-out);
      }
      .x-card h3 {
        font: var(--type-title);
        color: var(--x-ink);
      }
      .x-port {
        display: grid;
        place-items: center;
        margin-bottom: 8px;
      }
      .x-dl {
        margin: 12px 0 0;
        font: var(--type-small);
      }
      .x-dl > div {
        display: grid;
        grid-template-columns: 4.6em minmax(0, 1fr);
        gap: 8px;
        padding: 7px 0;
        border-top: 1px solid var(--x-line);
      }
      .x-dl dt {
        color: var(--text-secondary);
      }
      .x-dl dd {
        margin: 0;
        color: var(--text-primary);
      }
      .x-cp {
        margin-top: 16px;
        padding: 20px 22px;
        border-radius: var(--r-l);
        border: 1px solid #e3dbf1;
        background: linear-gradient(140deg, rgba(246, 221, 228, 0.6), rgba(230, 224, 243, 0.6));
      }
      .x-cp h3 {
        font: var(--type-heading);
        color: var(--x-ink);
      }
      .x-stars {
        font-variant-numeric: tabular-nums;
      }
      .x-toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translate(-50%, 16px);
        padding: 10px 18px;
        border-radius: var(--r-pill);
        background: var(--fill-primary);
        color: var(--text-primary-on);
        font: var(--type-tag);
        opacity: 0;
        pointer-events: none;
        transition: all var(--dur-quick) var(--ease-out);
      }
      .x-toast.is-on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .x-sink {
        position: absolute;
        left: -9999px;
        top: 0;
      }
      @media (max-width: 640px) {
        .x-duo {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>

          .join("");
        [...box.children].forEach((b) =>

          hairName: hair[0],
          hairHex: hair[1],
          eye: eye[0],
          eyeKind: eye[1],

          featName: feat[0],

          gap: pick(GAP),

        const eyes =

            : k === "narrow"
              ? `<path d="M52,82 Q58,77 64,82" stroke="#2f2a33" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M76,82 Q82,77 88,82" stroke="#2f2a33" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
              : `<path d="M52,80 Q58,88 64,80" stroke="#2f2a33" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M76,80 Q82,88 88,80" stroke="#2f2a33" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
        let acc = "";
        if (p.acc === "glasses")
          acc = `<g stroke="#6b4a57" stroke-width="1.6" fill="none"><circle cx="58" cy="82" r="10"/><circle cx="82" cy="82" r="10"/><path d="M68,82 L72,82"/></g>`;
        if (p.acc === "clip")
          acc = `<rect x="94" y="58" width="14" height="6" rx="3" fill="#e8768f" transform="rotate(-18 101 61)"/>`;
        if (p.acc === "mole") acc = `<circle cx="57" cy="91" r="1.8" fill="#8a5a66"/>`;
        return `<svg width="140" height="150" viewBox="0 0 140 150" role="img" aria-label="${p.name}的简笔画头像"><circle cx="70" cy="84" r="34" fill="#fbeadf" stroke="#e8cdbd" stroke-width="1.5"/>${hair}${eyes}<path d="M65,100 Q70,105 75,100" stroke="#c98596" stroke-width="2.2" fill="none" stroke-linecap="round"/>${acc}</svg>`;
      }

      function cardHTML(p, side) {
        return `<article class="x-card" id="card-${side}">
          <div class="x-port">${portrait(p)}</div>
          <h3>${p.name} <span class="pill">${p.age}岁</span></h3>
          <p class="fineprint">${p.ident} · ${p.tag}</p>
          <dl class="x-dl">
            <div><dt>外貌</dt><dd>${p.hairName}${p.hairStyle}，${p.eye}，${p.height}</dd></div>
            <div><dt>穿搭</dt><dd>${p.outfit}</dd></div>
            <div><dt>特征</dt><dd>${p.featName}</dd></div>
            <div><dt>性格</dt><dd>${p.traits.join(" · ")}</dd></div>
            <div><dt>反差萌</dt><dd>${p.gap}</dd></div>
            <div><dt>口头禅</dt><dd>${p.say}</dd></div>
          </dl>
        </article>`;
      }

      let curSet = "";
      function makeCP(which) {
        const s = curSet,
          t = which === "both" || !cp ? realTrope() : cp.trope;
        cp = {
          set: s,
          trope: t,
          name: A.given[0] + B.given[0],
          rel: REL[t],
          meet: pick(MEET),
          scene: pick(SCENE),
          sweet: 3 + Math.floor(Math.random() * 3),
          hurt: 1 + Math.floor(Math.random() * 4),
          story: [pick(OPEN)(A, B, s), pick(OPEN2)(A, B), pick(OPEN3)()].join(""),
        };
      }

      function cpHTML() {
        return `<section class="x-cp">
          <p class="fineprint">${cp.set} · ${cp.trope}</p>
          <h3>CP名：${cp.name}</h3>
          <dl class="x-dl">
            <div><dt>关系</dt><dd>${cp.rel}</dd></div>
            <div><dt>初遇</dt><dd>${cp.meet}</dd></div>
            <div><dt>名场面</dt><dd>${cp.scene}</dd></div>
            <div><dt>甜度</dt><dd class="x-stars">${stars(cp.sweet)}</dd></div>
            <div><dt>虐度</dt><dd class="x-stars">${stars(cp.hurt)}</dd></div>
            <div><dt>故事开头</dt><dd>${cp.story}</dd></div>
          </dl>
        </section>`;
      }

      const duo = document.getElementById("duo"),
        cpBox = document.getElementById("cpBox"),
        tools = document.getElementById("tools"),
        toastEl = document.getElementById("toast");

      function render() {
        duo.innerHTML = cardHTML(A, "a") + cardHTML(B, "b");
        cpBox.innerHTML = cpHTML();
        tools.hidden = false;
      }

      function fade(fn) {
        duo.classList.add("is-out");
        cpBox.classList.add("is-out");
        setTimeout(() => {
          fn();
          render();
          duo.classList.remove("is-out");
          cpBox.classList.remove("is-out");
        }, 180);
      }

      function generate(which) {
        if (which === "both" || !curSet) curSet = realSetting();
        const s = curSet;
        const isCool = (p) => TAGS_COOL.includes(p.tag);
        if (which === "both") {
          A = person(s, Math.random() < 0.5);
          B = person(s, !isCool(A));
        } else if (which === "a") A = person(s, !isCool(B));
        else B = person(s, !isCool(A));
        makeCP(which);
        if (which === "both" || !which) {
          n += 1;
          document.getElementById("count").textContent = "今晚已嗑了 " + n + " 对";
        }
      }

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("is-on");
        setTimeout(() => toastEl.classList.remove("is-on"), 1800);
      }

      function plain(p) {
        return `【${p.name}】${p.age}岁 ${p.ident} ${p.tag}
外貌：${p.hairName}${p.hairStyle}，${p.eye}，${p.height}
穿搭：${p.outfit}
特征：${p.featName}
性格：${p.traits.join("、")}
反差萌：${p.gap}
口头禅：${p.say}`;
      }

      function copyAll() {
        const txt = `双女主人设 · ${cp.set} · ${cp.trope}
${plain(A)}

${plain(B)}

CP名：${cp.name}
关系：${cp.rel}
初遇：${cp.meet}
名场面：${cp.scene}
甜度：${stars(cp.sweet)}　虐度：${stars(cp.hurt)}
故事开头：${cp.story}`;
        const btn = tools.querySelector('[data-act="copy"]');
        btn.textContent = "已复制 ✓";
        setTimeout(() => (btn.textContent = "复制人设"), 1800);
        toast("已复制，快去写文吧");
        const sink = () => fallback(txt, () => {});
        try {
          if (navigator.clipboard && navigator.clipboard.writeText)
            navigator.clipboard.writeText(txt).catch(sink);
          else sink();
        } catch (e) {
          sink();
        }
      }
      function fallback(txt, done) {
        const t = document.getElementById("sink");
        t.value = txt;
        t.select();
        try {
          document.execCommand("copy");
          done();
        } catch (e) {
          toast("复制失败，请手动选择文本");
        }
      }

      chips(document.getElementById("setChips"), SETS, setting, (v) => (setting = v));
      chips(document.getElementById("tropeChips"), TROPES, trope, (v) => (trope = v));
      document.getElementById("go").addEventListener("click", () => fade(() => generate("both")));
      tools.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const act = b.dataset.act;
        if (act === "copy") copyAll();
        else fade(() => generate(act));
      });
      generate("both");
      n = 0;
      document.getElementById("count").textContent = "今晚已嗑了 0 对";
      render();
    </script>
  </body>
</html>
